<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 220" width="420" height="220">
  <style>
    text { font-family: SimSun, "Microsoft YaHei", serif; font-size: 14px; fill: #333; }
  </style>
  <!-- 组合三角形图：一个大三角形被分成多个小三角形 -->
  <!-- 外轮廓 -->
  <polygon points="210,20 40,190 380,190" fill="none" stroke="#333" stroke-width="2"/>
  <!-- 内部分割线 -->
  <line x1="210" y1="20" x2="210" y2="190" stroke="#333" stroke-width="1.6"/>
  <line x1="125" y1="105" x2="295" y2="105" stroke="#333" stroke-width="1.6"/>
  <line x1="125" y1="105" x2="295" y2="190" stroke="#333" stroke-width="1.4"/>
  <line x1="295" y1="105" x2="125" y2="190" stroke="#333" stroke-width="1.4"/>
  <!-- 标注 -->
  <text x="210" y="215" text-anchor="middle">按构成三角形的小图形个数分类计数</text>
</svg>
