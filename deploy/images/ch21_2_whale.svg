<svg xmlns="http://www.w3.org/2000/svg" width="660" height="250" viewBox="0 0 660 250">
<rect x="0" y="0" width="660" height="250" fill="#fdfefe" stroke="#d5dbdb" rx="10"/>
<text x="330" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#2c3e50">年龄差始终保持不变：26−2=24 = 年龄差×3</text>
<line x1="70" y1="130" x2="610" y2="130" stroke="#2c3e50" stroke-width="2"/>
<line x1="100" y1="122" x2="100" y2="138" stroke="#2c3e50" stroke-width="2"/>
<text x="100" y="158" text-anchor="middle" font-size="13" fill="#2c3e50" font-weight="bold">2岁</text>
<line x1="220" y1="122" x2="220" y2="138" stroke="#2c3e50" stroke-width="2"/>
<text x="220" y="158" text-anchor="middle" font-size="13" fill="#2c3e50" font-weight="bold">10岁</text>
<line x1="340" y1="122" x2="340" y2="138" stroke="#2c3e50" stroke-width="2"/>
<text x="340" y="158" text-anchor="middle" font-size="13" fill="#2c3e50" font-weight="bold">18岁</text>
<line x1="460" y1="122" x2="460" y2="138" stroke="#2c3e50" stroke-width="2"/>
<text x="460" y="158" text-anchor="middle" font-size="13" fill="#2c3e50" font-weight="bold">26岁</text>
<path d="M106,100 q54.0,-32 108,0" stroke="#e67e22" stroke-width="2" fill="none"/>
<text x="160.0" y="78" text-anchor="middle" font-size="12.5" fill="#e67e22" font-weight="bold">差8岁</text>
<path d="M226,100 q54.0,-32 108,0" stroke="#e67e22" stroke-width="2" fill="none"/>
<text x="280.0" y="78" text-anchor="middle" font-size="12.5" fill="#e67e22" font-weight="bold">差8岁</text>
<path d="M346,100 q54.0,-32 108,0" stroke="#e67e22" stroke-width="2" fill="none"/>
<text x="400.0" y="78" text-anchor="middle" font-size="12.5" fill="#e67e22" font-weight="bold">差8岁</text>
<text x="100" y="182" text-anchor="middle" font-size="12" fill="#666">那时小鱼2岁</text>
<text x="220" y="182" text-anchor="middle" font-size="12" fill="#666">小鱼现在10岁</text>
<text x="340" y="182" text-anchor="middle" font-size="12" fill="#666">大鱼现在18岁</text>
<text x="460" y="182" text-anchor="middle" font-size="12" fill="#666">那时大鱼26岁</text>
</svg>