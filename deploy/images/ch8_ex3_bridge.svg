<svg xmlns="http://www.w3.org/2000/svg" width="500" height="350" viewBox="0 0 500 350">
  <rect width="500" height="350" fill="#f5f5f5"/>
  
  <!-- 标题 -->
  <text x="250" y="25" text-anchor="middle" font-size="16" fill="#2c3e50" font-weight="bold">河上架桥问题</text>
  
  <!-- 河岸CD（上岸） -->
  <line x1="50" y1="120" x2="450" y2="120" stroke="#3498db" stroke-width="3"/>
  <text x="30" y="125" text-anchor="middle" font-size="14" fill="#3498db" font-weight="bold">C</text>
  <text x="470" y="125" text-anchor="middle" font-size="14" fill="#3498db" font-weight="bold">D</text>
  
  <!-- 河岸EF（下岸） -->
  <line x1="50" y1="220" x2="450" y2="220" stroke="#3498db" stroke-width="3"/>
  <text x="30" y="225" text-anchor="middle" font-size="14" fill="#3498db" font-weight="bold">E</text>
  <text x="470" y="225" text-anchor="middle" font-size="14" fill="#3498db" font-weight="bold">F</text>
  
  <!-- 河流 -->
  <rect x="50" y="120" width="400" height="100" fill="#3498db" opacity="0.2"/>
  <text x="250" y="175" text-anchor="middle" font-size="14" fill="#3498db">河流</text>
  
  <!-- 村镇A（左岸） -->
  <circle cx="150" cy="80" r="20" fill="#e74c3c"/>
  <text x="150" y="85" text-anchor="middle" font-size="16" fill="#fff" font-weight="bold">A</text>
  
  <!-- 村镇B（右岸） -->
  <circle cx="350" cy="260" r="20" fill="#27ae60"/>
  <text x="350" y="265" text-anchor="middle" font-size="16" fill="#fff" font-weight="bold">B</text>
  
  <!-- 桥MN -->
  <rect x="245" y="115" width="10" height="110" fill="#e67e22" stroke="#d35400" stroke-width="2"/>
  <text x="250" y="110" text-anchor="middle" font-size="12" fill="#e67e22" font-weight="bold">M</text>
  <text x="250" y="240" text-anchor="middle" font-size="12" fill="#e67e22" font-weight="bold">N</text>
  
  <!-- 路径 A→M→N→B -->
  <path d="M150,80 L250,120 L250,220 L350,260" fill="none" stroke="#e74c3c" stroke-width="2" stroke-dasharray="5,5"/>
  
  <!-- 平移示意 -->
  <text x="250" y="310" text-anchor="middle" font-size="14" fill="#666">将A向下平移河的宽度至A₁，连结A₁B确定桥的位置</text>
  <text x="250" y="330" text-anchor="middle" font-size="14" fill="#27ae60" font-weight="bold">最短路程 = AM + MN + NB</text>
</svg>
