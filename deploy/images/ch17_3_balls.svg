<svg xmlns="http://www.w3.org/2000/svg" width="660" height="290" viewBox="0 0 660 290">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e67e22"/></marker></defs>
<rect x="0" y="0" width="660" height="290" fill="#fdfefe" stroke="#d5dbdb" rx="10"/>
<text x="330" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#2c3e50">盒子按球数重新排序，"现在"与"原来"一模一样</text>
<text x="70" y="90" font-size="16" font-weight="bold" fill="#7f8c8d">原来：</text>
<rect x="130" y="60" width="90" height="46" rx="6" fill="#eaf2f8" stroke="#3498db" stroke-width="1.8"/>
<rect x="240" y="60" width="90" height="46" rx="6" fill="#eaf2f8" stroke="#3498db" stroke-width="1.8"/>
<circle cx="262" cy="83" r="8" fill="#2c3e50"/>
<rect x="350" y="60" width="90" height="46" rx="6" fill="#eaf2f8" stroke="#3498db" stroke-width="1.8"/>
<circle cx="372" cy="83" r="8" fill="#2c3e50"/>
<circle cx="395" cy="83" r="8" fill="#2c3e50"/>
<rect x="460" y="60" width="90" height="46" rx="6" fill="#eaf2f8" stroke="#3498db" stroke-width="1.8"/>
<circle cx="482" cy="83" r="8" fill="#2c3e50"/>
<circle cx="505" cy="83" r="8" fill="#2c3e50"/>
<circle cx="528" cy="83" r="8" fill="#2c3e50"/>
<text x="600" y="90" font-size="16" fill="#7f8c8d">……</text>
<text x="70" y="235" font-size="16" font-weight="bold" fill="#7f8c8d">现在：</text>
<rect x="130" y="205" width="90" height="46" rx="6" fill="#eaf2f8" stroke="#3498db" stroke-width="1.8"/>
<rect x="240" y="205" width="90" height="46" rx="6" fill="#eaf2f8" stroke="#3498db" stroke-width="1.8"/>
<circle cx="262" cy="228" r="8" fill="#2c3e50"/>
<rect x="350" y="205" width="90" height="46" rx="6" fill="#eaf2f8" stroke="#3498db" stroke-width="1.8"/>
<circle cx="372" cy="228" r="8" fill="#2c3e50"/>
<circle cx="395" cy="228" r="8" fill="#2c3e50"/>
<rect x="460" y="205" width="90" height="46" rx="6" fill="#eaf2f8" stroke="#3498db" stroke-width="1.8"/>
<circle cx="482" cy="228" r="8" fill="#2c3e50"/>
<circle cx="505" cy="228" r="8" fill="#2c3e50"/>
<circle cx="528" cy="228" r="8" fill="#2c3e50"/>
<text x="600" y="235" font-size="16" fill="#7f8c8d">……</text>
<line x1="305" y1="112" x2="155" y2="196" stroke="#e67e22" stroke-width="2.2" marker-end="url(#arr)"/>
<line x1="415" y1="112" x2="265" y2="196" stroke="#e67e22" stroke-width="2.2" marker-end="url(#arr)"/>
<line x1="525" y1="112" x2="375" y2="196" stroke="#e67e22" stroke-width="2.2" marker-end="url(#arr)"/>
<text x="330" y="276" text-anchor="middle" font-size="12.5" fill="#7f8c8d">每个非空盒拿走 1 个球放入空盒 → 球数为 1，2，3，… 的盒子依次变成 0，1，2，…，重排后与原来相同</text>
</svg>