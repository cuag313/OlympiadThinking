<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 360" width="420" height="360">
  <style>
    text { font-family: "Times New Roman", SimSun, serif; font-size: 18px; font-style: italic; }
    .blue { fill: #3030a0; }
    .dk { fill: #222; }
  </style>

  <!-- 正方形 ABCD：A左上、B左下、C右下、D右上 -->
  <polygon points="70,90 70,270 250,270 250,90" fill="#f4e5df" stroke="#8b4513" stroke-width="2.4"/>

  <!-- 长方形 AEFG：A→E→F→G，FG 过 D -->
  <polygon points="70,90 210,270 322,183 182,3" fill="none" stroke="#e03a3a" stroke-width="2.4"/>

  <!-- 三角形 AED -->
  <polygon points="70,90 210,270 250,90" fill="#a8e0e8" stroke="#3030a0" stroke-width="1.2" opacity="0.85"/>

  <!-- 顶点 -->
  <circle cx="70" cy="90" r="6" class="blue"/>
  <circle cx="70" cy="270" r="6" class="blue"/>
  <circle cx="250" cy="270" r="6" class="dk"/>
  <circle cx="250" cy="90" r="6" class="dk"/>
  <circle cx="210" cy="270" r="6" class="blue"/>
  <circle cx="322" cy="183" r="6" class="dk"/>
  <circle cx="182" cy="3" r="6" class="dk"/>

  <!-- 字母 -->
  <text x="52" y="98" text-anchor="end" class="blue">A</text>
  <text x="52" y="278" text-anchor="end" class="blue">B</text>
  <text x="210" y="300" text-anchor="middle" class="blue">E</text>
  <text x="255" y="300" text-anchor="middle" class="dk">C</text>
  <text x="268" y="96" text-anchor="start" class="dk">D</text>
  <text x="332" y="190" text-anchor="start" class="dk">F</text>
  <text x="182" y="22" text-anchor="middle" class="dk">G</text>
</svg>
