<svg xmlns="http://www.w3.org/2000/svg" width="400" height="200" viewBox="0 0 400 200">
  <rect width="400" height="200" fill="#fff"/>
  
  <!-- 绘制8x8棋盘格 -->
  <g>
    <!-- 第1行 -->
    <rect x="50" y="20" width="30" height="30" fill="#333"/>
    <rect x="80" y="20" width="30" height="30" fill="#fff" stroke="#333" stroke-width="1"/>
    <rect x="110" y="20" width="30" height="30" fill="#333"/>
    <rect x="140" y="20" width="30" height="30" fill="#fff" stroke="#333" stroke-width="1"/>
    <rect x="170" y="20" width="30" height="30" fill="#333"/>
    <rect x="200" y="20" width="30" height="30" fill="#fff" stroke="#333" stroke-width="1"/>
    <rect x="230" y="20" width="30" height="30" fill="#333"/>
    <rect x="260" y="20" width="30" height="30" fill="#fff" stroke="#333" stroke-width="1"/>
    
    <!-- 第2行 -->
    <rect x="50" y="50" width="30" height="30" fill="#fff" stroke="#333" stroke-width="1"/>
    <rect x="80" y="50" width="30" height="30" fill="#333"/>
    <rect x="110" y="50" width="30" height="30" fill="#fff" stroke="#333" stroke-width="1"/>
    <rect x="140" y="50" width="30" height="30" fill="#333"/>
    <rect x="170" y="50" width="30" height="30" fill="#fff" stroke="#333" stroke-width="1"/>
    <rect x="200" y="50" width="30" height="30" fill="#333"/>
    <rect x="230" y="50" width="30" height="30" fill="#fff" stroke="#333" stroke-width="1"/>
    <rect x="260" y="50" width="30" height="30" fill="#333"/>
    
    <!-- 第3行 -->
    <rect x="50" y="80" width="30" height="30" fill="#333"/>
    <rect x="80" y="80" width="30" height="30" fill="#fff" stroke="#333" stroke-width="1"/>
    <rect x="110" y="80" width="30" height="30" fill="#333"/>
    <rect x="140" y="80" width="30" height="30" fill="#fff" stroke="#333" stroke-width="1"/>
    <rect x="170" y="80" width="30" height="30" fill="#333"/>
    <rect x="200" y="80" width="30" height="30" fill="#fff" stroke="#333" stroke-width="1"/>
    <rect x="230" y="80" width="30" height="30" fill="#333"/>
    <rect x="260" y="80" width="30" height="30" fill="#fff" stroke="#333" stroke-width="1"/>
    
    <!-- 第4行 -->
    <rect x="50" y="110" width="30" height="30" fill="#fff" stroke="#333" stroke-width="1"/>
    <rect x="80" y="110" width="30" height="30" fill="#333"/>
    <rect x="110" y="110" width="30" height="30" fill="#fff" stroke="#333" stroke-width="1"/>
    <rect x="140" y="110" width="30" height="30" fill="#333"/>
    <rect x="170" y="110" width="30" height="30" fill="#fff" stroke="#333" stroke-width="1"/>
    <rect x="200" y="110" width="30" height="30" fill="#333"/>
    <rect x="230" y="110" width="30" height="30" fill="#fff" stroke="#333" stroke-width="1"/>
    <rect x="260" y="110" width="30" height="30" fill="#333"/>
  </g>
  
  <!-- 标注(2,3)位置 -->
  <rect x="110" y="50" width="30" height="30" fill="#e74c3c" opacity="0.5"/>
  <text x="125" y="70" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">(2,3)</text>
  
  <!-- 行号 -->
  <text x="40" y="40" text-anchor="end" font-size="12" fill="#333">1</text>
  <text x="40" y="70" text-anchor="end" font-size="12" fill="#333">2</text>
  <text x="40" y="100" text-anchor="end" font-size="12" fill="#333">3</text>
  <text x="40" y="130" text-anchor="end" font-size="12" fill="#333">4</text>
  
  <!-- 列号 -->
  <text x="65" y="15" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="95" y="15" text-anchor="middle" font-size="12" fill="#333">2</text>
  <text x="125" y="15" text-anchor="middle" font-size="12" fill="#333">3</text>
  <text x="155" y="15" text-anchor="middle" font-size="12" fill="#333">4</text>
  <text x="185" y="15" text-anchor="middle" font-size="12" fill="#333">5</text>
  <text x="215" y="15" text-anchor="middle" font-size="12" fill="#333">6</text>
  <text x="245" y="15" text-anchor="middle" font-size="12" fill="#333">7</text>
  <text x="275" y="15" text-anchor="middle" font-size="12" fill="#333">8</text>
  
  <!-- 标题 -->
  <text x="200" y="180" text-anchor="middle" font-size="14" fill="#2c3e50">黑白相间的方格纸</text>
</svg>
