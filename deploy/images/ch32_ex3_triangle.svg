<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="320" height="240">
  <style>
    text { font-family: SimSun, "Microsoft YaHei", serif; font-size: 14px; fill: #333; }
  </style>
  <!-- 三角形 ABC，E中点，BD:DC=1:2 -->
  <polygon points="60,50 260,50 160,200" fill="#e8f0fe" stroke="#3030a0" stroke-width="2"/>
  <text x="60" y="42" text-anchor="middle">A</text>
  <text x="260" y="42" text-anchor="middle">C</text>
  <text x="160" y="220" text-anchor="middle">B</text>
  <!-- E 中点 AC -->
  <circle cx="160" cy="50" r="4" fill="#333"/>
  <text x="160" y="38" text-anchor="middle">E</text>
  <!-- D 在 BC，BD:DC=1:2 -->
  <circle cx="193" cy="150" r="4" fill="#333"/>
  <text x="205" y="155" text-anchor="start">D</text>
  <!-- AD -->
  <line x1="60" y1="50" x2="193" y2="150" stroke="#e03a3a" stroke-width="1.5"/>
  <!-- BE -->
  <line x1="160" y1="200" x2="160" y2="50" stroke="#e03a3a" stroke-width="1.5"/>
  <!-- F 交点 -->
  <circle cx="160" cy="95" r="4" fill="#222"/>
  <text x="170" y="98" text-anchor="start">F</text>
  <!-- 连 CF -->
  <line x1="260" y1="50" x2="160" y2="95" stroke="#999" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="160" y="238" text-anchor="middle">S△ABC=1，求四边形DFEC的面积</text>
</svg>
