<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 200" width="420" height="200">
  <style>
    text { font-family: SimSun, "Microsoft YaHei", serif; font-size: 13px; fill: #333; }
  </style>
  <!-- 第1图 2x3 -->
  <text x="70" y="22" text-anchor="middle">第1个图</text>
  <rect x="20" y="35" width="100" height="80" fill="none" stroke="#333" stroke-width="1.8"/>
  <rect x="20" y="35" width="25" height="80" fill="#222"/>
  <rect x="95" y="35" width="25" height="80" fill="#222"/>
  <rect x="45" y="35" width="50" height="80" fill="#fff" stroke="#333" stroke-width="1"/>
  <text x="70" y="135" text-anchor="middle">白砖2块</text>

  <!-- 第2图 3x4 -->
  <text x="210" y="22" text-anchor="middle">第2个图</text>
  <rect x="160" y="35" width="100" height="120" fill="none" stroke="#333" stroke-width="1.8"/>
  <rect x="160" y="35" width="25" height="120" fill="#222"/>
  <rect x="235" y="35" width="25" height="120" fill="#222"/>
  <rect x="185" y="35" width="50" height="120" fill="#fff" stroke="#333" stroke-width="1"/>
  <line x1="185" y1="75" x2="235" y2="75" stroke="#333" stroke-width="1"/>
  <text x="210" y="175" text-anchor="middle">白砖6块</text>

  <!-- 第3图 4x5 -->
  <text x="350" y="22" text-anchor="middle">第3个图</text>
  <rect x="300" y="35" width="100" height="125" fill="none" stroke="#333" stroke-width="1.8"/>
  <rect x="300" y="35" width="25" height="125" fill="#222"/>
  <rect x="375" y="35" width="25" height="125" fill="#222"/>
  <rect x="325" y="35" width="50" height="125" fill="#fff" stroke="#333" stroke-width="1"/>
  <line x1="325" y1="77" x2="375" y2="77" stroke="#333" stroke-width="1"/>
  <line x1="325" y1="119" x2="375" y2="119" stroke="#333" stroke-width="1"/>
  <text x="350" y="185" text-anchor="middle">白砖12块</text>
</svg>
