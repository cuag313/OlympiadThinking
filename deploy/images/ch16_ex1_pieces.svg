<svg xmlns="http://www.w3.org/2000/svg" width="640" height="230" viewBox="0 0 640 230">
  <rect x="0" y="0" width="640" height="230" fill="#fdfefe" stroke="#d5dbdb" rx="10"/>
  <text x="320" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#2c3e50">取棋子游戏：甲先取1枚，之后每轮与对手"凑3"</text>

  <!-- 剩余棋子按3枚一组示意 -->
  <text x="70" y="62" text-anchor="middle" font-size="13" fill="#7f8c8d">剩下99枚（3的倍数）：</text>
  <g fill="#3498db" stroke="#2980b9">
    <circle cx="230" cy="58" r="9"/><circle cx="252" cy="58" r="9"/><circle cx="274" cy="58" r="9"/>
    <circle cx="316" cy="58" r="9"/><circle cx="338" cy="58" r="9"/><circle cx="360" cy="58" r="9"/>
    <circle cx="402" cy="58" r="9"/><circle cx="424" cy="58" r="9"/><circle cx="446" cy="58" r="9"/>
  </g>
  <text x="490" y="63" text-anchor="middle" font-size="16" fill="#7f8c8d">…… 共33组</text>
  <text x="252" y="86" text-anchor="middle" font-size="11" fill="#7f8c8d">3枚</text>
  <text x="338" y="86" text-anchor="middle" font-size="11" fill="#7f8c8d">3枚</text>
  <text x="424" y="86" text-anchor="middle" font-size="11" fill="#7f8c8d">3枚</text>
  <path d="M221,74 q0,6 10,6 M283,74 q0,6 -10,6" stroke="#95a5a6" fill="none"/>
  <path d="M307,74 q0,6 10,6 M369,74 q0,6 -10,6" stroke="#95a5a6" fill="none"/>
  <path d="M393,74 q0,6 10,6 M455,74 q0,6 -10,6" stroke="#95a5a6" fill="none"/>

  <!-- 配对策略 -->
  <g font-size="14">
    <rect x="40" y="112" width="260" height="44" rx="8" fill="#eaf2f8" stroke="#3498db"/>
    <text x="170" y="130" text-anchor="middle" fill="#2c3e50">乙取 <tspan font-weight="bold" fill="#e67e22">1</tspan> 枚 → 甲取 <tspan font-weight="bold" fill="#2980b9">2</tspan> 枚</text>
    <text x="170" y="148" text-anchor="middle" font-size="12" fill="#7f8c8d">一轮共取走 3 枚</text>
    <rect x="340" y="112" width="260" height="44" rx="8" fill="#eaf2f8" stroke="#3498db"/>
    <text x="470" y="130" text-anchor="middle" fill="#2c3e50">乙取 <tspan font-weight="bold" fill="#e67e22">2</tspan> 枚 → 甲取 <tspan font-weight="bold" fill="#2980b9">1</tspan> 枚</text>
    <text x="470" y="148" text-anchor="middle" font-size="12" fill="#7f8c8d">一轮共取走 3 枚</text>
  </g>

  <text x="320" y="195" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#27ae60">无论乙怎么取，每轮（乙+甲）恰好取走 3 枚</text>
  <text x="320" y="217" text-anchor="middle" font-size="12.5" fill="#7f8c8d">最后3枚轮到乙取时，乙取1枚甲取2枚、乙取2枚甲取1枚，最后一枚必被甲取走</text>
</svg>
