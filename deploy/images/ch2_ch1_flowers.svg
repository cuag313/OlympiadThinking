<svg xmlns="http://www.w3.org/2000/svg" width="600" height="200" viewBox="0 0 600 200">
  <rect width="600" height="200" fill="#f5f5f5"/>
  
  <!-- 月季花 -->
  <line x1="50" y1="80" x2="250" y2="80" stroke="#e74c3c" stroke-width="4"/>
  <text x="150" y="70" text-anchor="middle" font-size="14" fill="#e74c3c" font-weight="bold">月季花</text>
  <text x="150" y="100" text-anchor="middle" font-size="12" fill="#333">53盆</text>
  
  <!-- 玫瑰花 -->
  <line x1="50" y1="120" x2="350" y2="120" stroke="#27ae60" stroke-width="4"/>
  <text x="200" y="110" text-anchor="middle" font-size="14" fill="#27ae60" font-weight="bold">玫瑰花</text>
  <text x="200" y="140" text-anchor="middle" font-size="12" fill="#333">65盆（比月季花多12盆）</text>
  
  <!-- 芍药花 -->
  <line x1="50" y1="160" x2="310" y2="160" stroke="#3498db" stroke-width="4"/>
  <text x="180" y="155" text-anchor="middle" font-size="14" fill="#3498db" font-weight="bold">芍药花</text>
  <text x="180" y="180" text-anchor="middle" font-size="12" fill="#333">62盆（比月季花多9盆）</text>
  
  <!-- 标注差异 -->
  <line x1="250" y1="75" x2="250" y2="85" stroke="#333" stroke-width="1"/>
  <line x1="350" y1="115" x2="350" y2="125" stroke="#333" stroke-width="1"/>
  <line x1="310" y1="155" x2="310" y2="165" stroke="#333" stroke-width="1"/>
  
  <!-- 标题 -->
  <text x="300" y="30" text-anchor="middle" font-size="16" fill="#2c3e50" font-weight="bold">三种花的线段图</text>
  <text x="300" y="50" text-anchor="middle" font-size="14" fill="#666">共180盆</text>
</svg>
