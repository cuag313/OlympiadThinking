<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <rect width="400" height="300" fill="#f5f5f5"/>
  
  <!-- 标题 -->
  <text x="200" y="25" text-anchor="middle" font-size="16" fill="#2c3e50" font-weight="bold">绿地中的小路</text>
  
  <!-- 大长方形（绿地） -->
  <rect x="50" y="50" width="300" height="200" fill="#d5f5e3" stroke="#27ae60" stroke-width="2"/>
  <text x="200" y="45" text-anchor="middle" font-size="12" fill="#27ae60">32米</text>
  <text x="45" y="150" text-anchor="middle" font-size="12" fill="#27ae60">26米</text>
  
  <!-- 小路（曲折） -->
  <polyline points="100,50 100,150 200,150 200,250" fill="none" stroke="#e67e22" stroke-width="8" opacity="0.5"/>
  <text x="150" y="140" text-anchor="middle" font-size="12" fill="#e67e22">宽2米</text>
  
  <!-- 说明 -->
  <text x="200" y="280" text-anchor="middle" font-size="14" fill="#666">小路面积 = 32×26 - (32-2)×(26-2) = 112平方米</text>
</svg>
