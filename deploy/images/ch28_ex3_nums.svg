<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 220" width="520" height="220">
  <style>
    text { font-family: SimSun, "Microsoft YaHei", serif; font-size: 13px; fill: #333; }
  </style>
  <!-- 图1 -->
  <rect x="8" y="8" width="230" height="170" rx="6" fill="#e8e4dc" stroke="#999"/>
  <text x="123" y="195" text-anchor="middle" font-size="14">图1</text>
  <!-- triangle of 1 / 2 2 / 3 3 3 / 4 4 4 4 -->
  <circle cx="123" cy="35" r="11" fill="#fff" stroke="#555"/><text x="123" y="40" text-anchor="middle">1</text>
  <circle cx="100" cy="65" r="11" fill="#fff" stroke="#555"/><text x="100" y="70" text-anchor="middle">2</text>
  <circle cx="146" cy="65" r="11" fill="#fff" stroke="#555"/><text x="146" y="70" text-anchor="middle">2</text>
  <circle cx="78" cy="95" r="11" fill="#fff" stroke="#555"/><text x="78" y="100" text-anchor="middle">3</text>
  <circle cx="123" cy="95" r="11" fill="#fff" stroke="#555"/><text x="123" y="100" text-anchor="middle">3</text>
  <circle cx="168" cy="95" r="11" fill="#fff" stroke="#555"/><text x="168" y="100" text-anchor="middle">3</text>
  <circle cx="55" cy="125" r="11" fill="#fff" stroke="#555"/><text x="55" y="130" text-anchor="middle">4</text>
  <circle cx="100" cy="125" r="11" fill="#fff" stroke="#555"/><text x="100" y="130" text-anchor="middle">4</text>
  <circle cx="146" cy="125" r="11" fill="#fff" stroke="#555"/><text x="146" y="130" text-anchor="middle">4</text>
  <circle cx="191" cy="125" r="11" fill="#fff" stroke="#555"/><text x="191" y="130" text-anchor="middle">4</text>
  <text x="123" y="165" text-anchor="middle" fill="#666">…</text>
  <!-- 图2 -->
  <rect x="270" y="8" width="230" height="170" rx="6" fill="#e8e4dc" stroke="#999"/>
  <text x="385" y="195" text-anchor="middle" font-size="14">图2</text>
  <circle cx="385" cy="35" r="11" fill="#fff" stroke="#555"/><text x="385" y="40" text-anchor="middle">1</text>
  <circle cx="362" cy="65" r="11" fill="#fff" stroke="#555"/><text x="362" y="70" text-anchor="middle">2</text>
  <circle cx="408" cy="65" r="11" fill="#fff" stroke="#555"/><text x="408" y="70" text-anchor="middle">2</text>
  <circle cx="340" cy="95" r="11" fill="#fff" stroke="#555"/><text x="340" y="100" text-anchor="middle">3</text>
  <circle cx="385" cy="95" r="11" fill="#fff" stroke="#555"/><text x="385" y="100" text-anchor="middle">3</text>
  <circle cx="430" cy="95" r="11" fill="#fff" stroke="#555"/><text x="430" y="100" text-anchor="middle">3</text>
  <text x="385" y="140" text-anchor="middle" fill="#666">…</text>
  <text x="260" y="140" text-anchor="middle" font-size="16" fill="#555">→</text>
</svg>