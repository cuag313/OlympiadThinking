<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300">
  <rect width="300" height="300" fill="#f5f5f5"/>
  
  <!-- 九宫格 -->
  <rect x="50" y="50" width="60" height="60" fill="#fff" stroke="#333" stroke-width="2"/>
  <rect x="110" y="50" width="60" height="60" fill="#fff" stroke="#333" stroke-width="2"/>
  <rect x="170" y="50" width="60" height="60" fill="#fff" stroke="#333" stroke-width="2"/>
  
  <rect x="50" y="110" width="60" height="60" fill="#fff" stroke="#333" stroke-width="2"/>
  <rect x="110" y="110" width="60" height="60" fill="#fff" stroke="#333" stroke-width="2"/>
  <rect x="170" y="110" width="60" height="60" fill="#fff" stroke="#333" stroke-width="2"/>
  
  <rect x="50" y="170" width="60" height="60" fill="#fff" stroke="#333" stroke-width="2"/>
  <rect x="110" y="170" width="60" height="60" fill="#fff" stroke="#333" stroke-width="2"/>
  <rect x="170" y="170" width="60" height="60" fill="#fff" stroke="#333" stroke-width="2"/>
  
  <!-- 填入数字 -->
  <text x="80" y="85" text-anchor="middle" font-size="24" fill="#333">□</text>
  <text x="140" y="85" text-anchor="middle" font-size="24" fill="#333">□</text>
  <text x="200" y="85" text-anchor="middle" font-size="24" fill="#e74c3c" font-weight="bold">7</text>
  
  <text x="80" y="145" text-anchor="middle" font-size="24" fill="#e74c3c" font-weight="bold">10</text>
  <text x="140" y="145" text-anchor="middle" font-size="24" fill="#e74c3c" font-weight="bold">6</text>
  <text x="200" y="145" text-anchor="middle" font-size="24" fill="#e74c3c" font-weight="bold">2</text>
  
  <text x="80" y="205" text-anchor="middle" font-size="24" fill="#333">□</text>
  <text x="140" y="205" text-anchor="middle" font-size="24" fill="#333">□</text>
  <text x="200" y="205" text-anchor="middle" font-size="24" fill="#e74c3c" font-weight="bold">9</text>
  
  <!-- 标题 -->
  <text x="150" y="30" text-anchor="middle" font-size="16" fill="#2c3e50" font-weight="bold">九宫格</text>
  <text x="150" y="270" text-anchor="middle" font-size="14" fill="#666">每行、每列、每对角线之和相等</text>
</svg>
