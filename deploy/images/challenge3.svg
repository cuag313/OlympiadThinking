<svg xmlns="http://www.w3.org/2000/svg" width="500" height="300" viewBox="0 0 500 300">
  <rect width="500" height="300" fill="#f5f5f5"/>
  <rect x="100" y="50" width="300" height="200" fill="none" stroke="#e74c3c" stroke-width="4"/>
  <line x1="100" y1="30" x2="400" y2="30" stroke="#3498db" stroke-width="2"/>
  <line x1="100" y1="25" x2="100" y2="35" stroke="#3498db" stroke-width="2"/>
  <line x1="400" y1="25" x2="400" y2="35" stroke="#3498db" stroke-width="2"/>
  <text x="250" y="25" text-anchor="middle" font-size="14" fill="#3498db" font-weight="bold">长</text>
  <line x1="420" y1="50" x2="420" y2="250" stroke="#27ae60" stroke-width="2"/>
  <line x1="415" y1="50" x2="425" y2="50" stroke="#27ae60" stroke-width="2"/>
  <line x1="415" y1="250" x2="425" y2="250" stroke="#27ae60" stroke-width="2"/>
  <text x="440" y="150" text-anchor="middle" font-size="14" fill="#27ae60" font-weight="bold" transform="rotate(90,440,150)">宽</text>
  <text x="250" y="280" text-anchor="middle" font-size="16" fill="#e74c3c" font-weight="bold">铁丝总长：80厘米</text>
  <text x="250" y="20" text-anchor="middle" font-size="12" fill="#666">长和宽都是5厘米的整数倍数</text>
</svg>
