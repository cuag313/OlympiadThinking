<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 280" width="280" height="280">
  <style>
    text { font-family: SimSun, "Microsoft YaHei", serif; font-size: 14px; fill: #333; }
  </style>
  <!-- 5x5网格 -->
  <g stroke="#333" stroke-width="1.5" fill="none">
    <rect x="40" y="40" width="200" height="200"/>
    <line x1="80" y1="40" x2="80" y2="240"/>
    <line x1="120" y1="40" x2="120" y2="240"/>
    <line x1="160" y1="40" x2="160" y2="240"/>
    <line x1="200" y1="40" x2="200" y2="240"/>
    <line x1="40" y1="80" x2="240" y2="80"/>
    <line x1="40" y1="120" x2="240" y2="120"/>
    <line x1="40" y1="160" x2="240" y2="160"/>
    <line x1="40" y1="200" x2="240" y2="200"/>
  </g>
  <!-- 星星位置：第2行第3列 -->
  <text x="140" y="108" text-anchor="middle" font-size="22" fill="#e03a3a">★</text>
  <text x="140" y="270" text-anchor="middle">含有★的正方形</text>
</svg>
