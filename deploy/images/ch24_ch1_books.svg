<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 220" width="500" height="220">
  <style>
    text { font-family: "Microsoft YaHei", Arial, sans-serif; font-size: 14px; }
    .label { font-weight: bold; }
    .person { font-size: 16px; font-weight: bold; }
  </style>
  
  <!-- 思思 -->
  <text x="60" y="40" class="person" fill="#e74c3c">思思</text>
  <rect x="40" y="50" width="120" height="40" rx="6" fill="#e74c3c" opacity="0.2" stroke="#e74c3c" stroke-width="2"/>
  <text x="100" y="75" text-anchor="middle" class="label">5本</text>
  
  <!-- 想想 -->
  <text x="320" y="40" class="person" fill="#3498db">想想</text>
  <rect x="300" y="50" width="150" height="40" rx="6" fill="#3498db" opacity="0.2" stroke="#3498db" stroke-width="2"/>
  <text x="375" y="75" text-anchor="middle" class="label">?本</text>
  
  <!-- 分享过程 -->
  <line x1="300" y1="70" x2="160" y2="70" stroke="#e67e22" stroke-width="2"/>
  <polygon points="165,65 155,70 165,75" fill="#e67e22"/>
  <text x="230" y="63" text-anchor="middle" fill="#e67e22" font-weight="bold">给3本</text>
  
  <!-- 分享后 -->
  <text x="60" y="130" class="label">思思现在：</text>
  <rect x="40" y="140" width="160" height="40" rx="6" fill="#e74c3c" opacity="0.3" stroke="#e74c3c" stroke-width="2"/>
  <text x="120" y="165" text-anchor="middle" class="label">5+3=8本</text>
  
  <text x="320" y="130" class="label">想想现在：</text>
  <rect x="300" y="140" width="160" height="40" rx="6" fill="#3498db" opacity="0.3" stroke="#3498db" stroke-width="2"/>
  <text x="380" y="165" text-anchor="middle" class="label">8×2=16本</text>
  
  <!-- 关系标注 -->
  <text x="250" y="160" text-anchor="middle" fill="#e67e22">2倍</text>
  
  <!-- 答案提示 -->
  <text x="60" y="210" class="label" fill="#27ae60">想想原来：16+3=19本</text>
</svg>