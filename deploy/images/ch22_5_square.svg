<svg xmlns="http://www.w3.org/2000/svg" width="420" height="400" viewBox="0 0 420 400">
<rect x="0" y="0" width="420" height="400" fill="#fdfefe" stroke="#d5dbdb" rx="10"/>
<text x="210" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#2c3e50">边长为(a+b)的正方形：面积两种算法</text>
<rect x="90" y="60" width="150" height="150" fill="#aed6f1" stroke="#2c3e50" stroke-width="1.6"/>
<text x="165.0" y="143.0" text-anchor="middle" font-size="19" font-weight="bold" fill="#2c3e50">a²</text>
<rect x="240" y="60" width="100" height="150" fill="#f5b7b1" stroke="#2c3e50" stroke-width="1.6"/>
<text x="290.0" y="143.0" text-anchor="middle" font-size="19" font-weight="bold" fill="#2c3e50">ab</text>
<rect x="90" y="210" width="150" height="100" fill="#f5b7b1" stroke="#2c3e50" stroke-width="1.6"/>
<text x="165.0" y="268.0" text-anchor="middle" font-size="19" font-weight="bold" fill="#2c3e50">ab</text>
<rect x="240" y="210" width="100" height="100" fill="#a9dfbf" stroke="#2c3e50" stroke-width="1.6"/>
<text x="290.0" y="268.0" text-anchor="middle" font-size="19" font-weight="bold" fill="#2c3e50">b²</text>
<rect x="90" y="60" width="250" height="250" fill="none" stroke="#2c3e50" stroke-width="2.6"/>
<line x1="90" y1="46" x2="240" y2="46" stroke="#555" stroke-width="1"/>
<text x="165.0" y="39" text-anchor="middle" font-size="14" fill="#555">a</text>
<line x1="240" y1="46" x2="340" y2="46" stroke="#555" stroke-width="1"/>
<text x="290.0" y="39" text-anchor="middle" font-size="14" fill="#555">b</text>
<line x1="76" y1="60" x2="76" y2="210" stroke="#555" stroke-width="1"/>
<text x="68" y="140.0" text-anchor="end" font-size="14" fill="#555">a</text>
<line x1="76" y1="210" x2="76" y2="310" stroke="#555" stroke-width="1"/>
<text x="68" y="265.0" text-anchor="end" font-size="14" fill="#555">b</text>
<text x="210" y="342" text-anchor="middle" font-size="14" fill="#1e8449" font-weight="bold">S=(a+b)² = a² + 2ab + b²</text>
</svg>