<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="400" height="260">
  <style>
    text { font-family: SimSun, "Microsoft YaHei", serif; font-size: 14px; fill: #333; }
    .num { font-size: 13px; }
  </style>
  <defs>
    <pattern id="h6" width="7" height="7" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <rect width="7" height="7" fill="#dddddd"/>
      <line x1="0" y1="0" x2="0" y2="7" stroke="#9a9a9a" stroke-width="1.6"/>
    </pattern>
    <marker id="ah6" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8" fill="none" stroke="#333" stroke-width="1.4"/>
    </marker>
  </defs>

  <!-- 移多补少弧形箭头 -->
  <text x="180" y="24" text-anchor="middle">移多补少</text>
  <path d="M 232 62 C 210 32, 160 30, 128 92" fill="none" stroke="#333" stroke-width="1.4" marker-end="url(#ah6)"/>
  <path d="M 128 92 C 148 56, 210 55, 238 62" fill="none" stroke="#333" stroke-width="0.8" opacity="0.7"/>

  <!-- 男生长方格 -->
  <rect x="70" y="125" width="105" height="90" fill="url(#h6)" stroke="#333" stroke-width="1.6"/>
  <!-- B 区域标注 -->
  <text x="122" y="116" text-anchor="middle" font-style="italic">B</text>
  <!-- 女生长方格 -->
  <rect x="175" y="70" width="120" height="145" fill="url(#h6)" stroke="#333" stroke-width="1.6"/>

  <!-- 91.2分 虚线 -->
  <line x1="45" y1="110" x2="175" y2="110" stroke="#333" stroke-width="1.2" stroke-dasharray="7,5"/>

  <!-- 右侧数据 -->
  <line x1="305" y1="70" x2="313" y2="70" stroke="#333" stroke-width="1"/>
  <text x="317" y="74" class="num">92分</text>
  <line x1="305" y1="110" x2="313" y2="110" stroke="#333" stroke-width="1"/>
  <text x="317" y="114" class="num">91.2分</text>

  <!-- 底部 -->
  <text x="122" y="240" text-anchor="middle">男生有24人</text>
  <text x="235" y="240" text-anchor="middle">女生有21人</text>
</svg>
