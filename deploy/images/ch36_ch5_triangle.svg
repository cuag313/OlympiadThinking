<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 280" width="300" height="280">
  <style>
    text { font-family: SimSun, "Microsoft YaHei", serif; font-size: 13px; fill: #333; }
  </style>
  <!-- 正三角形分成9个小三角形 -->
  <polygon points="150,20 30,240 270,240" fill="none" stroke="#333" stroke-width="2"/>
  <!-- 三等分点连线 -->
  <!-- 左边三等分: (150,20)->(30,240)，点: (110,93),(70,166) -->
  <!-- 右边: (150,20)->(270,240)，点: (190,93),(230,166) -->
  <!-- 底边: (30,240)->(270,240)，点: (110,240),(190,240) -->
  <line x1="110" y1="93" x2="190" y2="93" stroke="#333" stroke-width="1.3"/>
  <line x1="70" y1="166" x2="230" y2="166" stroke="#333" stroke-width="1.3"/>
  <line x1="150" y1="20" x2="110" y2="240" stroke="#333" stroke-width="1.3"/>
  <line x1="150" y1="20" x2="190" y2="240" stroke="#333" stroke-width="1.3"/>
  <line x1="30" y1="240" x2="190" y2="93" stroke="#333" stroke-width="1.3"/>
  <line x1="270" y1="240" x2="110" y2="93" stroke="#333" stroke-width="1.3"/>
  <!-- 标注 -->
  <text x="150" y="265" text-anchor="middle">分成9个小正三角形</text>
  <text x="150" y="278" text-anchor="middle">10个点放入，必有2点在同一个小三角形内</text>
</svg>
