<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300">
  <rect width="300" height="300" fill="#f5f5f5"/>
  
  <!-- 4x4方格 -->
  <rect x="50" y="50" width="50" height="50" fill="#fff" stroke="#333" stroke-width="2"/>
  <rect x="100" y="50" width="50" height="50" fill="#fff" stroke="#333" stroke-width="2"/>
  <rect x="150" y="50" width="50" height="50" fill="#fff" stroke="#333" stroke-width="2"/>
  <rect x="200" y="50" width="50" height="50" fill="#fff" stroke="#333" stroke-width="2"/>
  
  <rect x="50" y="100" width="50" height="50" fill="#fff" stroke="#333" stroke-width="2"/>
  <rect x="100" y="100" width="50" height="50" fill="#fff" stroke="#333" stroke-width="2"/>
  <rect x="150" y="100" width="50" height="50" fill="#fff" stroke="#333" stroke-width="2"/>
  <rect x="200" y="100" width="50" height="50" fill="#fff" stroke="#333" stroke-width="2"/>
  
  <rect x="50" y="150" width="50" height="50" fill="#fff" stroke="#333" stroke-width="2"/>
  <rect x="100" y="150" width="50" height="50" fill="#fff" stroke="#333" stroke-width="2"/>
  <rect x="150" y="150" width="50" height="50" fill="#fff" stroke="#333" stroke-width="2"/>
  <rect x="200" y="150" width="50" height="50" fill="#fff" stroke="#333" stroke-width="2"/>
  
  <rect x="50" y="200" width="50" height="50" fill="#fff" stroke="#333" stroke-width="2"/>
  <rect x="100" y="200" width="50" height="50" fill="#fff" stroke="#333" stroke-width="2"/>
  <rect x="150" y="200" width="50" height="50" fill="#fff" stroke="#333" stroke-width="2"/>
  <rect x="200" y="200" width="50" height="50" fill="#fff" stroke="#333" stroke-width="2"/>
  
  <!-- 填入数字 -->
  <text x="75" y="80" text-anchor="middle" font-size="20" fill="#333">3</text>
  <text x="125" y="80" text-anchor="middle" font-size="20" fill="#333">2</text>
  <text x="175" y="80" text-anchor="middle" font-size="20" fill="#999">□</text>
  <text x="225" y="80" text-anchor="middle" font-size="20" fill="#999">□</text>
  
  <text x="75" y="130" text-anchor="middle" font-size="20" fill="#999">□</text>
  <text x="125" y="130" text-anchor="middle" font-size="20" fill="#e74c3c" font-weight="bold">A</text>
  <text x="175" y="130" text-anchor="middle" font-size="20" fill="#333">2</text>
  <text x="225" y="130" text-anchor="middle" font-size="20" fill="#999">□</text>
  
  <text x="75" y="180" text-anchor="middle" font-size="20" fill="#999">□</text>
  <text x="125" y="180" text-anchor="middle" font-size="20" fill="#333">3</text>
  <text x="175" y="180" text-anchor="middle" font-size="20" fill="#999">□</text>
  <text x="225" y="180" text-anchor="middle" font-size="20" fill="#333">1</text>
  
  <text x="75" y="230" text-anchor="middle" font-size="20" fill="#333">1</text>
  <text x="125" y="230" text-anchor="middle" font-size="20" fill="#999">□</text>
  <text x="175" y="230" text-anchor="middle" font-size="20" fill="#999">□</text>
  <text x="225" y="230" text-anchor="middle" font-size="20" fill="#999">□</text>
  
  <!-- 高亮A -->
  <rect x="100" y="100" width="50" height="50" fill="#e74c3c" opacity="0.2"/>
  
  <!-- 标题 -->
  <text x="150" y="30" text-anchor="middle" font-size="16" fill="#2c3e50" font-weight="bold">4×4方格填数</text>
  <text x="150" y="280" text-anchor="middle" font-size="14" fill="#666">每行每列恰好是1,2,3,4</text>
</svg>
