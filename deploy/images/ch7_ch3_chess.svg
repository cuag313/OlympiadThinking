<svg xmlns="http://www.w3.org/2000/svg" width="400" height="350" viewBox="0 0 400 350">
  <rect width="400" height="350" fill="#f5f5f5"/>
  
  <!-- 标题 -->
  <text x="200" y="30" text-anchor="middle" font-size="16" fill="#2c3e50" font-weight="bold">象棋比赛对阵图</text>
  
  <!-- 五个选手 -->
  <circle cx="200" cy="80" r="30" fill="#e74c3c"/>
  <text x="200" y="85" text-anchor="middle" font-size="18" fill="#fff" font-weight="bold">A</text>
  <text x="200" y="120" text-anchor="middle" font-size="12" fill="#e74c3c">4盘</text>
  
  <circle cx="80" cy="180" r="30" fill="#3498db"/>
  <text x="80" y="185" text-anchor="middle" font-size="18" fill="#fff" font-weight="bold">B</text>
  <text x="80" y="220" text-anchor="middle" font-size="12" fill="#3498db">3盘</text>
  
  <circle cx="320" cy="180" r="30" fill="#27ae60"/>
  <text x="320" y="185" text-anchor="middle" font-size="18" fill="#fff" font-weight="bold">C</text>
  <text x="320" y="220" text-anchor="middle" font-size="12" fill="#27ae60">2盘</text>
  
  <circle cx="120" cy="300" r="30" fill="#f39c12"/>
  <text x="120" y="305" text-anchor="middle" font-size="18" fill="#fff" font-weight="bold">D</text>
  <text x="120" y="340" text-anchor="middle" font-size="12" fill="#f39c12">?盘</text>
  
  <circle cx="280" cy="300" r="30" fill="#9b59b6"/>
  <text x="280" y="305" text-anchor="middle" font-size="18" fill="#fff" font-weight="bold">E</text>
  <text x="280" y="340" text-anchor="middle" font-size="12" fill="#9b59b6">1盘</text>
  
  <!-- 连线表示比赛 -->
  <!-- A与B比赛 -->
  <line x1="175" y1="100" x2="105" y2="160" stroke="#e74c3c" stroke-width="3"/>
  <!-- A与C比赛 -->
  <line x1="225" y1="100" x2="295" y2="160" stroke="#e74c3c" stroke-width="3"/>
  <!-- A与D比赛 -->
  <line x1="185" y1="105" x2="135" y2="275" stroke="#e74c3c" stroke-width="3"/>
  <!-- A与E比赛 -->
  <line x1="215" y1="105" x2="265" y2="275" stroke="#e74c3c" stroke-width="3"/>
  
  <!-- B与C比赛 -->
  <line x1="110" y1="180" x2="290" y2="180" stroke="#3498db" stroke-width="3"/>
  <!-- B与D比赛 -->
  <line x1="90" y1="210" x2="110" y2="270" stroke="#3498db" stroke-width="3"/>
  
  <!-- 说明 -->
  <text x="200" y="350" text-anchor="middle" font-size="12" fill="#666">连线表示两人比赛过</text>
</svg>
