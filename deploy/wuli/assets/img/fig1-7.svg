<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <!-- 图1-7 例1：均匀直杆置于光滑半球形容器内（L>2R，杆伸出容器口） -->
  <!-- 球的完整圆（虚线） -->
  <circle cx="300" cy="180" r="130" fill="none" stroke="#9ca3af" stroke-width="1.3" stroke-dasharray="6 5"/>
  <!-- 半球形容器：下半圆弧（实线） -->
  <path d="M 170 180 A 130 130 0 0 0 430 180" fill="none" stroke="#4b5563" stroke-width="2.5"/>
  <!-- 开口直径（虚线） -->
  <line x1="170" y1="180" x2="430" y2="180" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="5 4"/>
  <!-- 球心 O' -->
  <circle cx="300" cy="180" r="3.5" fill="#1f2937"/>
  <text x="272" y="198" font-size="14" fill="#1f2937" font-style="italic">O′</text>
  <!-- 三力共点 O（与 A 关于 O′ 对称，在圆上） -->
  <circle cx="369" cy="70" r="3.5" fill="#2563eb"/>
  <text x="376" y="62" font-size="15" fill="#2563eb" font-style="italic">O</text>
  <!-- 杆：A(231,290) → B(430,180) → C 端(504,139)，伸出容器口 -->
  <line x1="231" y1="290" x2="504" y2="139" stroke="#1f2937" stroke-width="6" stroke-linecap="round"/>
  <!-- A 点（杆端，弧上） -->
  <circle cx="231" cy="290" r="4" fill="#1f2937"/>
  <text x="212" y="308" font-size="15" fill="#1f2937" font-style="italic">A</text>
  <!-- B 点（容器口边缘接触） -->
  <circle cx="430" cy="180" r="4" fill="#1f2937"/>
  <text x="438" y="198" font-size="15" fill="#1f2937" font-style="italic">B</text>
  <!-- C 端（杆另一端，容器外） -->
  <text x="512" y="132" font-size="15" fill="#1f2937" font-style="italic">C</text>
  <!-- θ 角 -->
  <line x1="231" y1="290" x2="321" y2="290" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 3"/>
  <path d="M 271 290 A 40 40 0 0 0 266 271" fill="none" stroke="#2563eb" stroke-width="1.5"/>
  <text x="276" y="282" font-size="14" fill="#2563eb" font-style="italic">θ</text>
  <!-- G：杆中点竖直向下 -->
  <line x1="367" y1="214" x2="367" y2="292" stroke="#dc2626" stroke-width="2.5"/>
  <polygon points="367,302 359,286 375,286" fill="#dc2626"/>
  <text x="360" y="318" font-size="15" fill="#dc2626" font-style="italic">G</text>
  <!-- N1：A 处沿半径指向球心 O′ -->
  <line x1="231" y1="290" x2="263" y2="239" stroke="#2563eb" stroke-width="2.5"/>
  <polygon points="266,230 254,243 268,247" fill="#2563eb"/>
  <text x="212" y="240" font-size="15" fill="#2563eb" font-style="italic">N₁</text>
  <!-- N2：B 处垂直杆（指向左上） -->
  <line x1="430" y1="180" x2="396" y2="119" stroke="#2563eb" stroke-width="2.5"/>
  <polygon points="391,111 391,126 404,119" fill="#2563eb"/>
  <text x="368" y="108" font-size="15" fill="#2563eb" font-style="italic">N₂</text>
  <!-- 三力作用线（虚线）汇交于 O -->
  <line x1="231" y1="290" x2="400" y2="42" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="430" y1="180" x2="330" y2="38" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="367" y1="214" x2="369" y2="70" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="310" y="378" font-size="14" fill="#6b7280">图 1-7</text>
</svg>
