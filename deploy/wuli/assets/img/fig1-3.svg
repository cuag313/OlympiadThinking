    <text x="163" y="253" font-size="12" font-style="italic">G</text>
    <text x="105" y="290" font-size="13" fill="#6b7280">(a)</text>
  </g>
  <!-- (b) -->
  <g>
    <line x1="300" y1="30" x2="300" y2="240" stroke="#4b5563" stroke-width="2.5"/>
