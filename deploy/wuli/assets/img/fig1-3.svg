<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <!-- 图1-3 三种支架：均为二力杆件（AB 拉力，BC 压力） -->
  <!-- (a) -->
  <g>
    <line x1="70" y1="30" x2="70" y2="240" stroke="#4b5563" stroke-width="2.5"/>
    <g stroke="#9ca3af" stroke-width="1.1">
      <line x1="70" y1="45" x2="56" y2="35"/><line x1="70" y1="85" x2="56" y2="75"/>
      <line x1="70" y1="125" x2="56" y2="115"/><line x1="70" y1="165" x2="56" y2="155"/>
      <line x1="70" y1="205" x2="56" y2="195"/><line x1="70" y1="235" x2="56" y2="225"/>
    </g>
    <line x1="70" y1="55" x2="170" y2="185" stroke="#1f2937" stroke-width="5" stroke-linecap="round"/>
    <line x1="70" y1="185" x2="170" y2="185" stroke="#1f2937" stroke-width="5" stroke-linecap="round"/>
    <circle cx="70" cy="55" r="3.5" fill="#1f2937"/>
