    <line x1="530" y1="30" x2="530" y2="240" stroke="#4b5563" stroke-width="2.5"/>
    <g stroke="#9ca3af" stroke-width="1.1">
      <line x1="530" y1="45" x2="516" y2="35"/><line x1="530" y1="85" x2="516" y2="75"/>
      <line x1="530" y1="125" x2="516" y2="115"/><line x1="530" y1="165" x2="516" y2="155"/>
