<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <!-- 图1-19 例5：两棒铰接，∠ABC=90°，C 在 A 正下方 -->
  <!-- 天花板 + 铰 A -->
  <line x1="200" y1="42" x2="360" y2="42" stroke="#4b5563" stroke-width="2.5"/>
  <g stroke="#9ca3af" stroke-width="1.1">
    <line x1="212" y1="42" x2="204" y2="30"/><line x1="232" y1="42" x2="224" y2="30"/>
    <line x1="252" y1="42" x2="244" y2="30"/><line x1="272" y1="42" x2="264" y2="30"/>
    <line x1="292" y1="42" x2="284" y2="30"/><line x1="312" y1="42" x2="304" y2="30"/>
    <line x1="332" y1="42" x2="324" y2="30"/><line x1="352" y1="42" x2="344" y2="30"/>
  </g>
  <circle cx="280" cy="54" r="5" fill="none" stroke="#1f2937" stroke-width="2"/>
  <text x="262" y="40" font-size="15" fill="#1f2937" font-style="italic">A</text>
  <!-- AB 棒：A(280,54) → B(421,195) -->
  <line x1="280" y1="54" x2="421" y2="195" stroke="#1f2937" stroke-width="7" stroke-linecap="round"/>
  <!-- BC 棒：B(421,195) → C(280,336) -->
  <line x1="421" y1="195" x2="280" y2="336" stroke="#1f2937" stroke-width="7" stroke-linecap="round"/>
  <!-- B 铰 + 直角标记 -->
  <circle cx="421" cy="195" r="4.5" fill="#fff" stroke="#1f2937" stroke-width="2"/>
  <text x="432" y="192" font-size="15" fill="#1f2937" font-style="italic">B</text>
  <path d="M 405 179 L 413 171" stroke="#6b7280" stroke-width="1.2" fill="none"/>
  <path d="M 405 179 L 397 187" stroke="#6b7280" stroke-width="1.2" fill="none"/>
  <!-- C 端 -->
  <circle cx="280" cy="336" r="4.5" fill="#1f2937"/>
  <text x="252" y="352" font-size="15" fill="#1f2937" font-style="italic">C</text>
  <!-- A—C 虚线（竖直） -->
  <line x1="280" y1="54" x2="280" y2="336" stroke="#9ca3af" stroke-width="1.1" stroke-dasharray="5 4"/>
  <!-- O1 中点 AB -->
  <circle cx="350" cy="124" r="3.5" fill="#2563eb"/>
  <text x="360" y="118" font-size="14" fill="#2563eb" font-style="italic">O₁</text>
  <!-- G1 -->
  <line x1="350" y1="128" x2="350" y2="186" stroke="#dc2626" stroke-width="2.3"/>
  <polygon points="350,196 342,180 358,180" fill="#dc2626"/>
  <text x="358" y="204" font-size="14" fill="#dc2626" font-style="italic">G₁</text>
  <!-- O2 中点 BC -->
  <circle cx="350" cy="265" r="3.5" fill="#2563eb"/>
  <text x="360" y="262" font-size="14" fill="#2563eb" font-style="italic">O₂</text>
  <!-- G2 -->
  <line x1="350" y1="269" x2="350" y2="326" stroke="#dc2626" stroke-width="2.3"/>
  <polygon points="350,336 342,320 358,320" fill="#dc2626"/>
  <text x="358" y="344" font-size="14" fill="#dc2626" font-style="italic">G₂</text>
  <!-- 外力 F 在 C 端（右上方向，与竖直成 β） -->
  <line x1="280" y1="336" x2="352" y2="288" stroke="#2563eb" stroke-width="2.6"/>
  <polygon points="362,281 344,280 352,294" fill="#2563eb"/>
  <text x="366" y="278" font-size="15" fill="#2563eb" font-style="italic">F</text>
  <!-- β 角标 -->
  <line x1="280" y1="336" x2="280" y2="272" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 3"/>
  <path d="M 280 300 A 36 36 0 0 1 302 292" fill="none" stroke="#2563eb" stroke-width="1.3"/>
  <text x="292" y="312" font-size="13" fill="#2563eb" font-style="italic">β</text>
  <text x="310" y="398" font-size="14" fill="#6b7280">图 1-19</text>
</svg>
