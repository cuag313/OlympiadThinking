<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <!-- 图1-12 例3：均匀梯子 AB 斜靠在光滑墙上 -->
  <!-- 墙 -->
  <line x1="170" y1="40" x2="170" y2="270" stroke="#4b5563" stroke-width="2.5"/>
  <g stroke="#9ca3af" stroke-width="1.2">
    <line x1="170" y1="52" x2="154" y2="42"/><line x1="170" y1="82" x2="154" y2="72"/>
    <line x1="170" y1="112" x2="154" y2="102"/><line x1="170" y1="142" x2="154" y2="132"/>
    <line x1="170" y1="172" x2="154" y2="162"/><line x1="170" y1="202" x2="154" y2="192"/>
    <line x1="170" y1="232" x2="154" y2="222"/><line x1="170" y1="262" x2="154" y2="252"/>
  </g>
  <!-- 地面 -->
  <line x1="140" y1="270" x2="560" y2="270" stroke="#4b5563" stroke-width="2.5"/>
  <g stroke="#9ca3af" stroke-width="1.2">
    <line x1="156" y1="270" x2="146" y2="286"/><line x1="196" y1="270" x2="186" y2="286"/>
    <line x1="236" y1="270" x2="226" y2="286"/><line x1="276" y1="270" x2="266" y2="286"/>
    <line x1="316" y1="270" x2="306" y2="286"/><line x1="356" y1="270" x2="346" y2="286"/>
    <line x1="396" y1="270" x2="386" y2="286"/><line x1="436" y1="270" x2="426" y2="286"/>
    <line x1="476" y1="270" x2="466" y2="286"/><line x1="516" y1="270" x2="506" y2="286"/>
    <line x1="556" y1="270" x2="546" y2="286"/>
  </g>
  <!-- 墙脚 C -->
  <text x="152" y="292" font-size="15" fill="#1f2937" font-style="italic">C</text>
  <!-- 梯子 AB：A(170,70) 在墙上，B(270,270) 在地上（比例 3.6:1.5） -->
  <line x1="170" y1="70" x2="270" y2="270" stroke="#1f2937" stroke-width="7" stroke-linecap="round"/>
  <circle cx="170" cy="70" r="4" fill="#1f2937"/>
  <text x="152" y="64" font-size="15" fill="#1f2937" font-style="italic">A</text>
  <circle cx="270" cy="270" r="4" fill="#1f2937"/>
  <text x="278" y="288" font-size="15" fill="#1f2937" font-style="italic">B</text>
  <!-- 尺寸标注 -->
  <line x1="170" y1="308" x2="270" y2="308" stroke="#9ca3af" stroke-width="1.2"/>
  <line x1="170" y1="302" x2="170" y2="314" stroke="#9ca3af" stroke-width="1.2"/>
  <line x1="270" y1="302" x2="270" y2="314" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="196" y="326" font-size="13" fill="#6b7280">1.5 m</text>
  <line x1="118" y1="70" x2="118" y2="270" stroke="#9ca3af" stroke-width="1.2"/>
  <line x1="112" y1="70" x2="124" y2="70" stroke="#9ca3af" stroke-width="1.2"/>
  <line x1="112" y1="270" x2="124" y2="270" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="62" y="176" font-size="13" fill="#6b7280">3.6 m</text>
  <text x="310" y="330" font-size="14" fill="#6b7280">图 1-12</text>
</svg>
