<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 280" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <!-- 图1-5 三力共点 -->
  <!-- 杆 -->
  <rect x="120" y="170" width="440" height="16" rx="8" fill="#e5e7eb" stroke="#4b5563" stroke-width="1.5"/>
  <!-- 共点 O -->
  <circle cx="340" cy="56" r="4" fill="#1f2937"/>
  <text x="332" y="44" font-size="15" fill="#1f2937" font-style="italic">O</text>
  <!-- 虚线作用线 -->
  <line x1="340" y1="56" x2="130" y2="178" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="5 4"/>
  <line x1="340" y1="56" x2="550" y2="178" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="5 4"/>
  <!-- F1 左端斜向左下 -->
  <line x1="130" y1="178" x2="62" y2="222" stroke="#dc2626" stroke-width="2.5"/>
  <polygon points="62,222 78,220 70,208" fill="#dc2626"/>
  <text x="36" y="240" font-size="15" fill="#dc2626" font-style="italic">F₁</text>
  <!-- F2 右端斜向右下 -->
  <line x1="550" y1="178" x2="618" y2="222" stroke="#dc2626" stroke-width="2.5"/>
  <polygon points="618,222 602,220 610,208" fill="#dc2626"/>
  <text x="622" y="240" font-size="15" fill="#dc2626" font-style="italic">F₂</text>
  <!-- F3 中部竖直向上 -->
  <line x1="340" y1="170" x2="340" y2="96" stroke="#2563eb" stroke-width="2.5"/>
  <polygon points="340,88 332,102 348,102" fill="#2563eb"/>
  <text x="350" y="100" font-size="15" fill="#2563eb" font-style="italic">F₃</text>
  <text x="310" y="262" font-size="14" fill="#6b7280">图 1-5</text>
</svg>
