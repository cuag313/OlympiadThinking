<svg xmlns="http://www.w3.org/2000/svg" width="520" height="300" viewBox="0 0 520 300">
  <defs>
    <clipPath id="park1">
      <rect x="35" y="60" width="160" height="130"/>
    </clipPath>
  </defs>
  <rect width="520" height="300" fill="#f5f5f5"/>
  <text x="260" y="22" text-anchor="middle" font-size="15" fill="#2c3e50" font-weight="bold">图1 折线小路 → 图2 竖段贴左、横段贴底</text>

  <!-- 图1：公园 160×130，小路宽 12；竖段贴左、横段贴底，保证可平移成图2 -->
  <text x="115" y="48" text-anchor="middle" font-size="13" fill="#333">图1</text>
  <rect x="35" y="60" width="160" height="130" fill="#d5f5e3" stroke="#2c3e50" stroke-width="2"/>
  <!-- 竖段1紧贴左边（x=35~47），再右折、下折、沿底到右下 -->
  <path d="M41,66 L41,103 L88,103 L88,184 L189,184"
        fill="none" stroke="#4dd0e1" stroke-width="12"
        stroke-linejoin="miter" stroke-linecap="square"
        clip-path="url(#park1)"/>
  <rect x="35" y="60" width="160" height="130" fill="none" stroke="#2c3e50" stroke-width="2"/>
  <text x="24" y="125" font-size="11" fill="#c0392b" transform="rotate(-90,24,125)">26米</text>
  <text x="115" y="208" text-anchor="middle" font-size="11" fill="#27ae60">32米</text>
  <!-- 路宽标注：打在竖段（V2）上，水平量出宽 2 米 -->
  <line x1="82" y1="150" x2="94" y2="150" stroke="#e67e22" stroke-width="1"/>
  <line x1="82" y1="144" x2="82" y2="156" stroke="#e67e22" stroke-width="1"/>
  <line x1="94" y1="144" x2="94" y2="156" stroke="#e67e22" stroke-width="1"/>
  <text x="100" y="153" font-size="10" fill="#e67e22">2米</text>

  <!-- 箭头 -->
  <line x1="215" y1="125" x2="265" y2="125" stroke="#333" stroke-width="2"/>
  <polygon points="265,125 257,120 257,130" fill="#333"/>
  <text x="240" y="115" text-anchor="middle" font-size="11" fill="#333">平移</text>

  <!-- 图2：左+底，与图1 同宽 12 -->
  <text x="385" y="48" text-anchor="middle" font-size="13" fill="#333">图2</text>
  <rect x="305" y="60" width="160" height="130" fill="#d5f5e3"/>
  <rect x="305" y="60" width="12" height="130" fill="#4dd0e1"/>
  <rect x="305" y="178" width="160" height="12" fill="#4dd0e1"/>
  <rect x="305" y="60" width="160" height="130" fill="none" stroke="#2c3e50" stroke-width="2"/>
  <text x="478" y="188" font-size="11" fill="#e67e22">2米</text>
  <text x="295" y="130" text-anchor="middle" font-size="11" fill="#c0392b" transform="rotate(-90,295,130)">26米</text>
  <text x="385" y="208" text-anchor="middle" font-size="11" fill="#27ae60">32米</text>

  <text x="260" y="250" text-anchor="middle" font-size="13" fill="#666">竖段拼左边、横段拼底边 → 草坪 30×24，小路 = 32×26−30×24 = 112</text>
</svg>
