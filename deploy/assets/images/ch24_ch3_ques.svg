<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 210" width="560" height="210">
  <style>
    text { font-family: "Microsoft YaHei", Arial, sans-serif; font-size: 14px; }
    .row { font-weight: bold; }
    .cnt { font-weight: bold; }
    .cap { font-size: 12px; fill: #555; }
    .hint { font-size: 12px; fill: #e67e22; font-weight: bold; }
  </style>

  <!-- 单位长度 64px：上层5份=320，下层3份=192，多出2份=128，只移最后1份=64 -->
  <!-- 上层 -->
  <text x="36" y="58" class="row" fill="#e74c3c">上层</text>
  <!-- 5等份：x=100..420 -->
  <rect x="100" y="38" width="320" height="40" rx="4" fill="#e74c3c" opacity="0.12" stroke="#c0392b" stroke-width="1.6"/>
  <!-- 份界线 -->
  <line x1="164" y1="38" x2="164" y2="78" stroke="#c0392b" stroke-width="1.2"/>
  <line x1="228" y1="38" x2="228" y2="78" stroke="#c0392b" stroke-width="1.2"/>
  <line x1="292" y1="38" x2="292" y2="78" stroke="#c0392b" stroke-width="1.2"/>
  <line x1="356" y1="38" x2="356" y2="78" stroke="#c0392b" stroke-width="1.2"/>
  <!-- 最后1份：虚线框 = 上层的1/5，也是「多出部分的一半」 -->
  <rect x="356" y="38" width="64" height="40" fill="#e67e22" opacity="0.18" stroke="#e67e22" stroke-width="2" stroke-dasharray="5,4"/>
  <text x="388" y="63" text-anchor="middle" class="hint">1/5</text>
  <text x="212" y="28" text-anchor="middle" class="cap">上层 5份</text>

  <!-- 下层 -->
  <text x="36" y="138" class="row" fill="#3498db">下层</text>
  <!-- 3等份：x=100..292 -->
  <rect x="100" y="118" width="192" height="40" rx="4" fill="#3498db" opacity="0.12" stroke="#2471a3" stroke-width="1.6"/>
  <line x1="164" y1="118" x2="164" y2="158" stroke="#2471a3" stroke-width="1.2"/>
  <line x1="228" y1="118" x2="228" y2="158" stroke="#2471a3" stroke-width="1.2"/>
  <text x="196" y="143" text-anchor="middle" class="cap" fill="#2471a3">下层 3份</text>

  <!-- 多出2份的范围（上层比下层长出 292→420 = 2份） -->
  <line x1="292" y1="88" x2="420" y2="88" stroke="#888" stroke-width="1"/>
  <line x1="292" y1="84" x2="292" y2="92" stroke="#888" stroke-width="1"/>
  <line x1="420" y1="84" x2="420" y2="92" stroke="#888" stroke-width="1"/>
  <text x="356" y="102" text-anchor="middle" class="cap">多出 2份</text>

  <!-- 只移一半：箭头只从最后1份指出，不覆盖全部多出部分 -->
  <path d="M 388 78 C 388 96, 360 108, 330 118" fill="none" stroke="#e67e22" stroke-width="2" marker-end="url(#arrDown)"/>
  <defs>
    <marker id="arrDown" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto">
      <path d="M0,1 L9,5 L0,9" fill="none" stroke="#e67e22" stroke-width="1.8"/>
    </marker>
  </defs>
  <text x="430" y="118" class="hint">只移一半</text>
  <text x="430" y="134" class="cap">= 1/5 = 1份</text>

  <!-- 共160本 -->
  <line x1="450" y1="38" x2="450" y2="158" stroke="#555" stroke-width="1.2"/>
  <text x="470" y="92" class="cnt" fill="#333">共</text>
  <text x="470" y="112" class="cnt" fill="#333">160本</text>
</svg>
