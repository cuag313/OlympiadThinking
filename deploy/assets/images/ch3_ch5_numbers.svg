<svg xmlns="http://www.w3.org/2000/svg" width="500" height="350" viewBox="0 0 500 350">
  <rect width="500" height="350" fill="#f5f5f5"/>
  
  <!-- 绘制数字排列（9列） -->
  <!-- 第1行：1-9 -->
  <text x="50" y="40" text-anchor="middle" font-size="14" fill="#333">1</text>
  <text x="90" y="40" text-anchor="middle" font-size="14" fill="#333">2</text>
  <text x="130" y="40" text-anchor="middle" font-size="14" fill="#333">3</text>
  <text x="170" y="40" text-anchor="middle" font-size="14" fill="#333">4</text>
  <text x="210" y="40" text-anchor="middle" font-size="14" fill="#333">5</text>
  <text x="250" y="40" text-anchor="middle" font-size="14" fill="#333">6</text>
  <text x="290" y="40" text-anchor="middle" font-size="14" fill="#333">7</text>
  <text x="330" y="40" text-anchor="middle" font-size="14" fill="#333">8</text>
  <text x="370" y="40" text-anchor="middle" font-size="14" fill="#333">9</text>
  
  <!-- 第2行：10-18 -->
  <text x="50" y="70" text-anchor="middle" font-size="14" fill="#333">10</text>
  <text x="90" y="70" text-anchor="middle" font-size="14" fill="#333">11</text>
  <text x="130" y="70" text-anchor="middle" font-size="14" fill="#333">12</text>
  <text x="170" y="70" text-anchor="middle" font-size="14" fill="#333">13</text>
  <text x="210" y="70" text-anchor="middle" font-size="14" fill="#333">14</text>
  <text x="250" y="70" text-anchor="middle" font-size="14" fill="#333">15</text>
  <text x="290" y="70" text-anchor="middle" font-size="14" fill="#333">16</text>
  <text x="330" y="70" text-anchor="middle" font-size="14" fill="#333">17</text>
  <text x="370" y="70" text-anchor="middle" font-size="14" fill="#333">18</text>
  
  <!-- 第3行：19-27 -->
  <text x="50" y="100" text-anchor="middle" font-size="14" fill="#333">19</text>
  <text x="90" y="100" text-anchor="middle" font-size="14" fill="#333">20</text>
  <text x="130" y="100" text-anchor="middle" font-size="14" fill="#333">21</text>
  <text x="170" y="100" text-anchor="middle" font-size="14" fill="#e74c3c" font-weight="bold">22</text>
  <text x="210" y="100" text-anchor="middle" font-size="14" fill="#e74c3c" font-weight="bold">23</text>
  <text x="250" y="100" text-anchor="middle" font-size="14" fill="#e74c3c" font-weight="bold">24</text>
  <text x="290" y="100" text-anchor="middle" font-size="14" fill="#333">25</text>
  <text x="330" y="100" text-anchor="middle" font-size="14" fill="#333">26</text>
  <text x="370" y="100" text-anchor="middle" font-size="14" fill="#333">27</text>
  
  <!-- 第4行：28-36 -->
  <text x="50" y="130" text-anchor="middle" font-size="14" fill="#333">28</text>
  <text x="90" y="130" text-anchor="middle" font-size="14" fill="#333">29</text>
  <text x="130" y="130" text-anchor="middle" font-size="14" fill="#333">30</text>
  <text x="170" y="130" text-anchor="middle" font-size="14" fill="#e74c3c" font-weight="bold">31</text>
  <text x="210" y="130" text-anchor="middle" font-size="14" fill="#e74c3c" font-weight="bold">32</text>
  <text x="250" y="130" text-anchor="middle" font-size="14" fill="#e74c3c" font-weight="bold">33</text>
  <text x="290" y="130" text-anchor="middle" font-size="14" fill="#333">34</text>
  <text x="330" y="130" text-anchor="middle" font-size="14" fill="#333">35</text>
  <text x="370" y="130" text-anchor="middle" font-size="14" fill="#333">36</text>
  
  <!-- 第5行：37-45 -->
  <text x="50" y="160" text-anchor="middle" font-size="14" fill="#333">37</text>
  <text x="90" y="160" text-anchor="middle" font-size="14" fill="#333">38</text>
  <text x="130" y="160" text-anchor="middle" font-size="14" fill="#333">39</text>
  <text x="170" y="160" text-anchor="middle" font-size="14" fill="#e74c3c" font-weight="bold">40</text>
  <text x="210" y="160" text-anchor="middle" font-size="14" fill="#e74c3c" font-weight="bold">41</text>
  <text x="250" y="160" text-anchor="middle" font-size="14" fill="#e74c3c" font-weight="bold">42</text>
  <text x="290" y="160" text-anchor="middle" font-size="14" fill="#333">43</text>
  <text x="330" y="160" text-anchor="middle" font-size="14" fill="#333">44</text>
  <text x="370" y="160" text-anchor="middle" font-size="14" fill="#333">45</text>
  
  <!-- 框出的9个数 -->
  <rect x="155" y="85" width="120" height="90" fill="none" stroke="#e74c3c" stroke-width="3"/>
  
  <!-- 省略号 -->
  <text x="410" y="40" text-anchor="middle" font-size="14" fill="#333">...</text>
  <text x="410" y="70" text-anchor="middle" font-size="14" fill="#333">...</text>
  <text x="410" y="100" text-anchor="middle" font-size="14" fill="#333">...</text>
  <text x="410" y="130" text-anchor="middle" font-size="14" fill="#333">...</text>
  <text x="410" y="160" text-anchor="middle" font-size="14" fill="#333">...</text>
  
  <!-- 更多行 -->
  <text x="50" y="200" text-anchor="middle" font-size="14" fill="#333">...</text>
  <text x="90" y="200" text-anchor="middle" font-size="14" fill="#333">...</text>
  <text x="130" y="200" text-anchor="middle" font-size="14" fill="#333">...</text>
  <text x="170" y="200" text-anchor="middle" font-size="14" fill="#333">...</text>
  <text x="210" y="200" text-anchor="middle" font-size="14" fill="#333">...</text>
  <text x="250" y="200" text-anchor="middle" font-size="14" fill="#333">...</text>
  <text x="290" y="200" text-anchor="middle" font-size="14" fill="#333">...</text>
  <text x="330" y="200" text-anchor="middle" font-size="14" fill="#333">...</text>
  <text x="370" y="200" text-anchor="middle" font-size="14" fill="#333">...</text>
  
  <!-- 最后一行：1000-1008 -->
  <text x="50" y="240" text-anchor="middle" font-size="14" fill="#333">1000</text>
  <text x="90" y="240" text-anchor="middle" font-size="14" fill="#333">1001</text>
  <text x="130" y="240" text-anchor="middle" font-size="14" fill="#333">1002</text>
  <text x="170" y="240" text-anchor="middle" font-size="14" fill="#333">1003</text>
  <text x="210" y="240" text-anchor="middle" font-size="14" fill="#333">1004</text>
  <text x="250" y="240" text-anchor="middle" font-size="14" fill="#333">1005</text>
  <text x="290" y="240" text-anchor="middle" font-size="14" fill="#333">1006</text>
  <text x="330" y="240" text-anchor="middle" font-size="14" fill="#333">1007</text>
  <text x="370" y="240" text-anchor="middle" font-size="14" fill="#333">1008</text>
  
  <!-- 说明 -->
  <text x="250" y="290" text-anchor="middle" font-size="14" fill="#2c3e50" font-weight="bold">数字排列图（1,2,3,...,1008 按9列排列）</text>
  <text x="250" y="310" text-anchor="middle" font-size="12" fill="#666">红色方框为示例：框出的9个数是22,23,24,31,32,33,40,41,42</text>
  <text x="250" y="330" text-anchor="middle" font-size="12" fill="#666">每行9个数，相邻两行对应位置相差9</text>
</svg>
