<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 550 250" width="550" height="250">
  <rect width="550" height="250" fill="#ffffff"/>
  
  <!-- ========== 图1 ========== -->
  
  <!-- 填充 -->
  <rect x="30" y="80" width="30" height="30" fill="#e3f2fd"/>
  <rect x="60" y="80" width="30" height="30" fill="#e3f2fd"/>
  <rect x="90" y="80" width="30" height="30" fill="#e3f2fd"/>
  <rect x="120" y="80" width="30" height="30" fill="#e3f2fd"/>
  <rect x="30" y="50" width="30" height="30" fill="#e3f2fd"/>
  <rect x="90" y="50" width="30" height="30" fill="#e3f2fd"/>
  <rect x="90" y="20" width="30" height="30" fill="#e3f2fd"/>
  
  <!-- 实线：非公共边 -->
  <line x1="30" y1="110" x2="150" y2="110" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="30" y1="80" x2="30" y2="110" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="150" y1="80" x2="150" y2="110" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="60" y1="80" x2="90" y2="80" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="120" y1="80" x2="150" y2="80" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="30" y1="50" x2="30" y2="80" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="30" y1="50" x2="60" y2="50" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="60" y1="50" x2="60" y2="80" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="90" y1="50" x2="90" y2="80" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="120" y1="50" x2="120" y2="80" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="90" y1="20" x2="90" y2="50" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="90" y1="20" x2="120" y2="20" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="120" y1="20" x2="120" y2="50" stroke="#1a1a1a" stroke-width="1.5"/>
  
  <!-- 虚线：公共边 -->
  <line x1="60" y1="80" x2="60" y2="110" stroke="#1a1a1a" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="90" y1="80" x2="90" y2="110" stroke="#1a1a1a" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="120" y1="80" x2="120" y2="110" stroke="#1a1a1a" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="30" y1="80" x2="60" y2="80" stroke="#1a1a1a" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="90" y1="80" x2="120" y2="80" stroke="#1a1a1a" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="90" y1="50" x2="120" y2="50" stroke="#1a1a1a" stroke-width="1" stroke-dasharray="3,2"/>
  
  <!-- 图1标签 -->
  <text x="90" y="125" text-anchor="middle" font-size="14" fill="#333" font-family="Microsoft YaHei, SimHei, sans-serif" font-weight="bold">图1</text>
  
  <!-- ========== 箭头 ========== -->
  <line x1="175" y1="65" x2="225" y2="65" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="200" y="55" text-anchor="middle" font-size="12" fill="#333" font-family="Microsoft YaHei, SimHei, sans-serif">平移</text>
  
  <!-- ========== 图2 ========== -->
  
  <!-- 3×4长方形外框 -->
  <rect x="250" y="30" width="120" height="90" fill="#e3f2fd" stroke="#1a1a1a" stroke-width="1.5"/>
  
  <!-- 不能移动的边：实线 -->
  <line x1="280" y1="60" x2="280" y2="90" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="310" y1="60" x2="310" y2="90" stroke="#1a1a1a" stroke-width="1.5"/>
  
  <!-- 图1中是虚线的公共边，到图2中继续保留虚线 -->
  <!-- 第1行与第2行之间的公共边（第1列和第3列） -->
  <line x1="250" y1="90" x2="280" y2="90" stroke="#1a1a1a" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="310" y1="90" x2="340" y2="90" stroke="#1a1a1a" stroke-width="1" stroke-dasharray="3,2"/>
  
  <!-- 图1中是实线但移动了的，到图2变成虚线 -->
  <!-- 底部第2个正方形的上边（图1中是实线，移动后变虚线） -->
  <line x1="280" y1="90" x2="310" y2="90" stroke="#1a1a1a" stroke-width="1" stroke-dasharray="3,2"/>
  <!-- 底部第4个正方形的上边（图1中是实线，移动后变虚线） -->
  <line x1="340" y1="90" x2="370" y2="90" stroke="#1a1a1a" stroke-width="1" stroke-dasharray="3,2"/>
  
  <!-- 第2行与第3行之间的公共边（第3列） -->
  <line x1="310" y1="60" x2="340" y2="60" stroke="#1a1a1a" stroke-width="1" stroke-dasharray="3,2"/>
  
  <!-- 图1中是实线但移动了的，到图2变成虚线 -->
  <!-- 第1列堆叠正方形的上边（图1中是实线，移动后变虚线） -->
  <line x1="250" y1="60" x2="280" y2="60" stroke="#1a1a1a" stroke-width="1" stroke-dasharray="3,2"/>
  <!-- 第3列左侧上方（移动了的实线） -->
  <line x1="310" y1="30" x2="310" y2="60" stroke="#1a1a1a" stroke-width="1" stroke-dasharray="3,2"/>
  <!-- 第3列右侧（移动了的实线） -->
  <line x1="340" y1="30" x2="340" y2="120" stroke="#1a1a1a" stroke-width="1" stroke-dasharray="3,2"/>
  <!-- 第1列右侧下方（移动了的实线） -->
  <line x1="280" y1="90" x2="280" y2="120" stroke="#1a1a1a" stroke-width="1" stroke-dasharray="3,2"/>
  <!-- 第3列左侧下方（移动了的实线） -->
  <line x1="310" y1="90" x2="310" y2="120" stroke="#1a1a1a" stroke-width="1" stroke-dasharray="3,2"/>
  
  <!-- 原来既没有实线也没有虚线的地方：空白（第2列、第4列的大部分区域） -->
  
  <!-- 尺寸标注 -->
  <text x="310" y="25" text-anchor="middle" font-size="12" fill="#333" font-family="Microsoft YaHei, SimHei, sans-serif">4厘米</text>
  <text x="385" y="80" text-anchor="middle" font-size="12" fill="#333" font-family="Microsoft YaHei, SimHei, sans-serif" transform="rotate(90,385,80)">3厘米</text>
  
  <!-- 图2标签 -->
  <text x="310" y="140" text-anchor="middle" font-size="14" fill="#333" font-family="Microsoft YaHei, SimHei, sans-serif" font-weight="bold">图2</text>
  
  <!-- 底部说明 -->
  <text x="275" y="175" text-anchor="middle" font-size="13" fill="#333" font-family="Microsoft YaHei, SimHei, sans-serif">周长 = (4+3)×2 + 2×1 = 16厘米</text>
  
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#333"/>
    </marker>
  </defs>
</svg>
