<svg xmlns="http://www.w3.org/2000/svg" width="460" height="430" viewBox="0 0 460 430">
<rect x="0" y="0" width="460" height="430" fill="#fdfefe" stroke="#d5dbdb" rx="10"/>
<text x="230" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#2c3e50">面积为1的正方形：依次取 1/2，1/4，1/8，…</text>
<rect x="60" y="60" width="160.0" height="320" fill="#cfe0ef" stroke="#7f8c8d" stroke-width="1"/>
<text x="140.0" y="224.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#4a6a8a">1/2</text>
<rect x="220.0" y="60" width="160.0" height="160.0" fill="#fbeaea" stroke="#7f8c8d" stroke-width="1"/>
<text x="300.0" y="144.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#4a6a8a">1/4</text>
<rect x="220.0" y="220.0" width="80.0" height="160.0" fill="#cfe0ef" stroke="#7f8c8d" stroke-width="1"/>
<text x="260.0" y="304.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#4a6a8a">1/8</text>
<rect x="300.0" y="220.0" width="80.0" height="80.0" fill="#fbeaea" stroke="#7f8c8d" stroke-width="1"/>
<text x="340.0" y="264.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a6a8a">1/16</text>
<rect x="300.0" y="300.0" width="40.0" height="80.0" fill="#cfe0ef" stroke="#7f8c8d" stroke-width="1"/>
<text x="320.0" y="344.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a6a8a">1/32</text>
<rect x="340.0" y="300.0" width="40.0" height="40.0" fill="#fbeaea" stroke="#7f8c8d" stroke-width="1"/>
<text x="360.0" y="324.0" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a6a8a">1/64</text>
<rect x="340.0" y="340.0" width="20.0" height="40.0" fill="#cfe0ef" stroke="#7f8c8d" stroke-width="1"/>
<text x="350.0" y="364.0" text-anchor="middle" font-size="8" font-weight="bold" fill="#4a6a8a">1/128</text>
<rect x="60" y="60" width="320" height="320" fill="none" stroke="#2c3e50" stroke-width="2.6"/>
<text x="230" y="414" text-anchor="middle" font-size="13" fill="#7f8c8d">不断重复取剩余的一半，最后剩下的空白正好是 1/128</text>
</svg>