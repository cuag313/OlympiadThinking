<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 280" width="520" height="280">
  <style>
    text { font-family: "Times New Roman", SimSun, serif; font-size: 16px; font-style: italic; fill: #333; }
  </style>
  <defs>
    <pattern id="hatch26" width="7" height="7" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <rect width="7" height="7" fill="#cccccc"/>
      <line x1="0" y1="0" x2="0" y2="7" stroke="#888" stroke-width="1.8"/>
    </pattern>
  </defs>

  <!-- 外框 ABCD：A左上 D右上 B左下 C右下 -->
  <rect x="50" y="40" width="420" height="200" fill="none" stroke="#333" stroke-width="2"/>
  <!-- 中线 EF -->
  <line x1="50" y1="140" x2="470" y2="140" stroke="#333" stroke-width="2"/>

  <!-- 上半 AEFD：3个正立三角，底边铺满 EF（140+140+140=420），尖朝上到 AD -->
  <polygon points="50,140 190,140 120,40"   fill="url(#hatch26)" stroke="#555" stroke-width="1"/>
  <polygon points="190,140 330,140 260,40"  fill="url(#hatch26)" stroke="#555" stroke-width="1"/>
  <polygon points="330,140 470,140 400,40"  fill="url(#hatch26)" stroke="#555" stroke-width="1"/>

  <!-- 下半 BCFE：2个正立三角，底边铺满 BC（210+210=420），尖朝上到 EF -->
  <polygon points="50,240 260,240 155,140"  fill="url(#hatch26)" stroke="#555" stroke-width="1"/>
  <polygon points="260,240 470,240 365,140" fill="url(#hatch26)" stroke="#555" stroke-width="1"/>

  <!-- 顶点字母 -->
  <text x="40" y="40" text-anchor="end">A</text>
  <text x="40" y="145" text-anchor="end">E</text>
  <text x="40" y="248" text-anchor="end">B</text>
  <text x="480" y="40" text-anchor="start">D</text>
  <text x="480" y="145" text-anchor="start">F</text>
  <text x="480" y="248" text-anchor="start">C</text>
</svg>
