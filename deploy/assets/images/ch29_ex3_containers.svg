<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 260" width="300" height="260">
  <style>text { font-family: "Microsoft YaHei", sans-serif; font-size: 14px; fill: #333; }</style>
  <!-- Container: bottom y=220, top y=80, height=140px. Pipe at 7/10 from bottom = y=220-98=y=122.
       Scale: 6cm = 96px, 1cm=16px.
       3cm: y=220-48=172; 4cm: y=220-64=156; 5cm: y=220-80=140; 6cm(pipe): y=124 -->
  <!-- Container A left wall, bottom -->
  <line x1="90" y1="80" x2="90" y2="220" stroke="#333" stroke-width="2.5"/>
  <line x1="90" y1="220" x2="130" y2="220" stroke="#333" stroke-width="2.5"/>
  <!-- A right wall with gap at pipe (y=118 to y=128) -->
  <line x1="130" y1="80" x2="130" y2="118" stroke="#333" stroke-width="2.5"/>
  <line x1="130" y1="128" x2="130" y2="220" stroke="#333" stroke-width="2.5"/>
  <!-- Container B right wall, bottom -->
  <line x1="210" y1="80" x2="210" y2="220" stroke="#333" stroke-width="2.5"/>
  <line x1="170" y1="220" x2="210" y2="220" stroke="#333" stroke-width="2.5"/>
  <!-- B left wall with gap at pipe -->
  <line x1="170" y1="80" x2="170" y2="118" stroke="#333" stroke-width="2.5"/>
  <line x1="170" y1="128" x2="170" y2="220" stroke="#333" stroke-width="2.5"/>
  <!-- Connecting pipe: two parallel lines -->
  <line x1="130" y1="118" x2="170" y2="118" stroke="#333" stroke-width="2"/>
  <line x1="130" y1="128" x2="170" y2="128" stroke="#333" stroke-width="2"/>
  <!-- Water in A at 4cm: y=156 to y=220 -->
  <rect x="92" y="156" width="36" height="64" fill="rgba(100,149,237,0.5)"/>
  <!-- Labels A, B -->
  <text x="110" y="100" text-anchor="middle">A</text>
  <text x="190" y="100" text-anchor="middle">B</text>
  <!-- Height markers on left side: 3cm, 4cm, 5cm, 6cm -->
  <line x1="75" y1="172" x2="85" y2="172" stroke="#666" stroke-width="1"/>
  <text x="65" y="176" text-anchor="end">3cm</text>
  <line x1="75" y1="156" x2="85" y2="156" stroke="#666" stroke-width="1"/>
  <text x="65" y="160" text-anchor="end">4cm</text>
  <line x1="75" y1="140" x2="85" y2="140" stroke="#666" stroke-width="1"/>
  <text x="65" y="144" text-anchor="end">5cm</text>
  <line x1="75" y1="123" x2="85" y2="123" stroke="#666" stroke-width="1"/>
  <text x="65" y="127" text-anchor="end">6cm</text>
</svg>
