<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 240" font-family="Microsoft YaHei, sans-serif" font-size="12">
  <defs>
    <pattern id="g8" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#ccc" stroke-width="0.5"/>
    </pattern>
    <pattern id="g9" width="17.78" height="17.78" patternUnits="userSpaceOnUse">
      <path d="M 17.78 0 L 0 0 0 17.78" fill="none" stroke="#ccc" stroke-width="0.5"/>
    </pattern>
  </defs>
  <!-- Left: k even = 8x8 (k=8) -->
  <g transform="translate(20,20)">
    <rect width="160" height="160" fill="url(#g8)"/>
    <line x1="0" y1="0" x2="0" y2="160" stroke="#333" stroke-width="1.5"/>
    <line x1="0" y1="160" x2="160" y2="160" stroke="#333" stroke-width="1.5"/>
    <line x1="0" y1="0" x2="160" y2="160" stroke="#333" stroke-width="1"/>
    <line x1="160" y1="0" x2="0" y2="160" stroke="#333" stroke-width="1"/>
    <!-- dots for c=8: (2,7)(3,6)(3,7)(4,5)(4,6)(4,7)(5,6)(5,7)(6,7)
         grid: x=a*20, y=160-b*20 -->
    <circle cx="40" cy="20" r="3" fill="#333"/>
    <circle cx="60" cy="40" r="3" fill="#333"/>
    <circle cx="60" cy="20" r="3" fill="#333"/>
    <circle cx="80" cy="60" r="3" fill="#333"/>
    <circle cx="80" cy="40" r="3" fill="#333"/>
    <circle cx="80" cy="20" r="3" fill="#333"/>
    <circle cx="100" cy="40" r="3" fill="#333"/>
    <circle cx="100" cy="20" r="3" fill="#333"/>
    <circle cx="120" cy="20" r="3" fill="#333"/>
    <text x="-15" y="5" fill="#333">b</text>
    <text x="155" y="175" fill="#333">a</text>
    <text x="60" y="190" fill="#333">k为偶数</text>
  </g>
  <!-- Right: k odd = 9x9 (k=9), cell=160/9=17.78 -->
  <g transform="translate(230,20)">
    <rect width="160" height="160" fill="url(#g9)"/>
    <line x1="0" y1="0" x2="0" y2="160" stroke="#333" stroke-width="1.5"/>
    <line x1="0" y1="160" x2="160" y2="160" stroke="#333" stroke-width="1.5"/>
    <line x1="0" y1="0" x2="160" y2="160" stroke="#333" stroke-width="1"/>
    <line x1="160" y1="0" x2="0" y2="160" stroke="#333" stroke-width="1"/>
    <!-- dots for c=9: (2,8)(3,7)(3,8)(4,6)(4,7)(4,8)(5,6)(5,7)(5,8)(6,7)(6,8)(7,8)
         x=a*17.78, y=160-b*17.78 -->
    <circle cx="35.6" cy="17.8" r="3" fill="#333"/>
    <circle cx="53.3" cy="35.6" r="3" fill="#333"/>
    <circle cx="53.3" cy="17.8" r="3" fill="#333"/>
    <circle cx="71.1" cy="53.3" r="3" fill="#333"/>
    <circle cx="71.1" cy="35.6" r="3" fill="#333"/>
    <circle cx="71.1" cy="17.8" r="3" fill="#333"/>
    <circle cx="88.9" cy="53.3" r="3" fill="#333"/>
    <circle cx="88.9" cy="35.6" r="3" fill="#333"/>
    <circle cx="88.9" cy="17.8" r="3" fill="#333"/>
    <circle cx="106.7" cy="35.6" r="3" fill="#333"/>
    <circle cx="106.7" cy="17.8" r="3" fill="#333"/>
    <circle cx="124.4" cy="17.8" r="3" fill="#333"/>
    <text x="-15" y="5" fill="#333">b</text>
    <text x="155" y="175" fill="#333">a</text>
    <text x="60" y="190" fill="#333">k为奇数</text>
  </g>
</svg>
