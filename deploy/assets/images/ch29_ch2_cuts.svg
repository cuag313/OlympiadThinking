<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 200" width="560" height="200">
  <style>
    text { font-family: SimSun, "Microsoft YaHei", serif; font-size: 13px; fill: #333; }
  </style>
  <!-- 图1 剪成三角形 -->
  <text x="90" y="22" text-anchor="middle">图1（3个角）</text>
  <rect x="40" y="40" width="100" height="70" fill="none" stroke="#333" stroke-width="2"/>
  <line x1="40" y1="40" x2="140" y2="110" stroke="#e03a3a" stroke-width="2.5"/>
  <polygon points="40,40 140,40 40,110" fill="#f5d0d0" stroke="none"/>
  <!-- 图2 剪成四边形 -->
  <text x="280" y="22" text-anchor="middle">图2（4个角）</text>
  <rect x="230" y="40" width="100" height="70" fill="none" stroke="#333" stroke-width="2"/>
  <line x1="230" y1="55" x2="310" y2="110" stroke="#e03a3a" stroke-width="2.5"/>
  <polygon points="230,40 310,40 230,55" fill="#f5d0d0" stroke="none"/>
  <!-- 图3 剪成五边形 -->
  <text x="470" y="22" text-anchor="middle">图3（5个角）</text>
  <rect x="420" y="40" width="100" height="70" fill="none" stroke="#333" stroke-width="2"/>
  <line x1="430" y1="40" x2="500" y2="90" stroke="#e03a3a" stroke-width="2.5"/>
  <polygon points="430,40 500,40 500,90" fill="#f5d0d0" stroke="none"/>
</svg>