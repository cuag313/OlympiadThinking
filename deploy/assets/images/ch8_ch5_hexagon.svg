<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 480" width="500" height="480">
  <!-- 六边形ABCDEF，A左上逆时针：A(133,400) B(367,400) C(475,303) D(350,173) E(150,173) F(25,303) -->
  
  <!-- 六边形填充 -->
  <polygon points="133,400 367,400 475,303 350,173 150,173 25,303" 
    fill="#e3f2fd" stroke="#1a1a1a" stroke-width="2.5" stroke-linejoin="round"/>
  
  <!-- 对边平行标记 -->
  <!-- AF // CD -->
  <line x1="70" y1="355" x2="55" y2="370" stroke="#666" stroke-width="1.2"/>
  <line x1="60" y1="357" x2="55" y2="370" stroke="#666" stroke-width="1.2"/>
  <line x1="68" y1="367" x2="55" y2="370" stroke="#666" stroke-width="1.2"/>
  <line x1="393" y1="230" x2="408" y2="245" stroke="#666" stroke-width="1.2"/>
  <line x1="400" y1="232" x2="408" y2="245" stroke="#666" stroke-width="1.2"/>
  <line x1="390" y1="242" x2="408" y2="245" stroke="#666" stroke-width="1.2"/>
  
  <!-- AB // DE -->
  <line x1="230" y1="395" x2="250" y2="395" stroke="#666" stroke-width="1.2"/>
  <line x1="240" y1="390" x2="250" y2="395" stroke="#666" stroke-width="1.2"/>
  <line x1="240" y1="400" x2="250" y2="395" stroke="#666" stroke-width="1.2"/>
  <line x1="190" y1="178" x2="210" y2="178" stroke="#666" stroke-width="1.2"/>
  <line x1="200" y1="173" x2="210" y2="178" stroke="#666" stroke-width="1.2"/>
  <line x1="200" y1="183" x2="210" y2="178" stroke="#666" stroke-width="1.2"/>
  
  <!-- BC // EF -->
  <line x1="435" y1="340" x2="450" y2="355" stroke="#666" stroke-width="1.2"/>
  <line x1="442" y1="342" x2="450" y2="355" stroke="#666" stroke-width="1.2"/>
  <line x1="432" y1="352" x2="450" y2="355" stroke="#666" stroke-width="1.2"/>
  <line x1="50" y1="305" x2="35" y2="320" stroke="#666" stroke-width="1.2"/>
  <line x1="42" y1="307" x2="35" y2="320" stroke="#666" stroke-width="1.2"/>
  <line x1="48" y1="317" x2="35" y2="320" stroke="#666" stroke-width="1.2"/>
  
  <!-- 顶点标注 -->
  <circle cx="133" cy="400" r="3" fill="#1a1a1a"/>
  <text x="118" y="425" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a" font-family="Microsoft YaHei, SimHei, sans-serif">A</text>
  
  <circle cx="367" cy="400" r="3" fill="#1a1a1a"/>
  <text x="382" y="425" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a" font-family="Microsoft YaHei, SimHei, sans-serif">B</text>
  
  <circle cx="475" cy="303" r="3" fill="#1a1a1a"/>
  <text x="495" y="308" text-anchor="start" font-size="18" font-weight="bold" fill="#1a1a1a" font-family="Microsoft YaHei, SimHei, sans-serif">C</text>
  
  <circle cx="350" cy="173" r="3" fill="#1a1a1a"/>
  <text x="363" y="163" text-anchor="start" font-size="18" font-weight="bold" fill="#1a1a1a" font-family="Microsoft YaHei, SimHei, sans-serif">D</text>
  
  <circle cx="150" cy="173" r="3" fill="#1a1a1a"/>
  <text x="137" y="163" text-anchor="end" font-size="18" font-weight="bold" fill="#1a1a1a" font-family="Microsoft YaHei, SimHei, sans-serif">E</text>
  
  <circle cx="25" cy="303" r="3" fill="#1a1a1a"/>
  <text x="5" y="298" text-anchor="end" font-size="18" font-weight="bold" fill="#1a1a1a" font-family="Microsoft YaHei, SimHei, sans-serif">F</text>
  
  <!-- 角B标记（120°） -->
  <path d="M 347,390 A 30,30 0 0,0 357,375" fill="none" stroke="#c0392b" stroke-width="1.5"/>
  <text x="340" y="378" text-anchor="middle" font-size="12" fill="#c0392b" font-family="sans-serif">120°</text>
</svg>
