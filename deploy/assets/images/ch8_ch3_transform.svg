<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 250" width="560" height="250">
  <rect width="560" height="250" fill="#ffffff"/>
  
  <!-- ===== 左侧：原图 ===== -->
  <text x="130" y="18" text-anchor="middle" font-size="13" fill="#666" font-family="Microsoft YaHei, SimHei, sans-serif">原图</text>
  
  <!-- 底部长方形 -->
  <line x1="20" y1="155" x2="20" y2="195" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="20" y1="195" x2="240" y2="195" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="240" y1="155" x2="240" y2="195" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="40" y1="155" x2="75" y2="155" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="110" y1="155" x2="145" y2="155" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="180" y1="155" x2="225" y2="155" stroke="#1a1a1a" stroke-width="2"/>
  
  <!-- 凸1 -->
  <line x1="20" y1="125" x2="20" y2="155" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="20" y1="125" x2="40" y2="125" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="40" y1="125" x2="40" y2="155" stroke="#1a1a1a" stroke-width="2"/>
  
  <!-- 凸2 -->
  <line x1="75" y1="85" x2="75" y2="155" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="75" y1="85" x2="110" y2="85" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="110" y1="85" x2="110" y2="155" stroke="#1a1a1a" stroke-width="2"/>
  
  <!-- 凸3 -->
  <line x1="145" y1="125" x2="145" y2="155" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="145" y1="125" x2="180" y2="125" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="180" y1="125" x2="180" y2="155" stroke="#1a1a1a" stroke-width="2"/>
  
  <!-- 凸4 -->
  <line x1="225" y1="100" x2="225" y2="155" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="225" y1="100" x2="240" y2="100" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="240" y1="100" x2="240" y2="155" stroke="#1a1a1a" stroke-width="2"/>
  
  <!-- ===== 箭头 ===== -->
  <text x="280" y="145" text-anchor="middle" font-size="24" fill="#c0392b" font-family="sans-serif">→</text>
  
  <!-- ===== 右侧：割补后 ===== -->
  <text x="430" y="18" text-anchor="middle" font-size="13" fill="#666" font-family="Microsoft YaHei, SimHei, sans-serif">割补后</text>
  
  <!-- 外框（全实线）：上边只到凸2顶部 -->
  <!-- 上边 -->
  <line x1="320" y1="85" x2="540" y2="85" stroke="#1a1a1a" stroke-width="2"/>
  <!-- 下边 -->
  <line x1="320" y1="195" x2="540" y2="195" stroke="#1a1a1a" stroke-width="2"/>
  <!-- 左边（凸2左竖线左移到此处） -->
  <line x1="320" y1="85" x2="320" y2="195" stroke="#1a1a1a" stroke-width="2"/>
  <!-- 右边（凸2右竖线右移到此处） -->
  <line x1="540" y1="85" x2="540" y2="195" stroke="#1a1a1a" stroke-width="2"/>
  
  <!-- 原图保留在原位 -->
  
  <!-- 底部长方形顶边空隙（已平移，原位虚线） -->
  <line x1="340" y1="155" x2="375" y2="155" stroke="#1a1a1a" stroke-width="2" stroke-dasharray="7 4"/>
  <line x1="410" y1="155" x2="445" y2="155" stroke="#1a1a1a" stroke-width="2" stroke-dasharray="7 4"/>
  <line x1="480" y1="155" x2="525" y2="155" stroke="#1a1a1a" stroke-width="2" stroke-dasharray="7 4"/>
  
  <!-- 凸1：顶边→虚线（移到上框）；左竖边→虚线（凸2左竖线左移到此）；右竖边→实线 -->
  <line x1="320" y1="125" x2="320" y2="155" stroke="#1a1a1a" stroke-width="2" stroke-dasharray="7 4"/>
  <line x1="320" y1="125" x2="340" y2="125" stroke="#1a1a1a" stroke-width="2" stroke-dasharray="7 4"/>
  <line x1="340" y1="125" x2="340" y2="155" stroke="#1a1a1a" stroke-width="2"/>
  
  <!-- 凸2：顶边→虚线；左竖边高出凸1部分→虚线（左移补齐左框）；右竖边高出凸4部分→虚线（右移补齐右框） -->
  <!-- 左竖边：凸1顶以上部分虚线，以下部分实线 -->
  <line x1="375" y1="85" x2="375" y2="125" stroke="#1a1a1a" stroke-width="2" stroke-dasharray="7 4"/>
  <line x1="375" y1="125" x2="375" y2="155" stroke="#1a1a1a" stroke-width="2"/>
  <!-- 顶边→虚线 -->
  <line x1="375" y1="85" x2="410" y2="85" stroke="#1a1a1a" stroke-width="2" stroke-dasharray="7 4"/>
  <!-- 右竖边：凸4顶以上部分虚线，以下部分实线 -->
  <line x1="410" y1="85" x2="410" y2="100" stroke="#1a1a1a" stroke-width="2" stroke-dasharray="7 4"/>
  <line x1="410" y1="100" x2="410" y2="155" stroke="#1a1a1a" stroke-width="2"/>
  
  <!-- 凸3：顶边→虚线；左右竖边→实线 -->
  <line x1="445" y1="125" x2="445" y2="155" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="445" y1="125" x2="480" y2="125" stroke="#1a1a1a" stroke-width="2" stroke-dasharray="7 4"/>
  <line x1="480" y1="125" x2="480" y2="155" stroke="#1a1a1a" stroke-width="2"/>
  
  <!-- 凸4：顶边→虚线；右竖边→虚线（凸2右竖线右移到此）；左竖边→实线 -->
  <line x1="525" y1="100" x2="525" y2="155" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="525" y1="100" x2="540" y2="100" stroke="#1a1a1a" stroke-width="2" stroke-dasharray="7 4"/>
  <line x1="540" y1="100" x2="540" y2="155" stroke="#1a1a1a" stroke-width="2" stroke-dasharray="7 4"/>
  
  <!-- 凹处横线（原位，虚线，已平移到上框） -->
  <line x1="340" y1="125" x2="375" y2="125" stroke="#1a1a1a" stroke-width="2" stroke-dasharray="7 4"/>
  <line x1="410" y1="125" x2="445" y2="125" stroke="#1a1a1a" stroke-width="2" stroke-dasharray="7 4"/>
  <line x1="480" y1="125" x2="525" y2="125" stroke="#1a1a1a" stroke-width="2" stroke-dasharray="7 4"/>
  
  <!-- 尺寸标注 -->
  <line x1="320" y1="213" x2="540" y2="213" stroke="#333" stroke-width="0.8"/>
  <line x1="320" y1="210" x2="320" y2="216" stroke="#333" stroke-width="0.8"/>
  <line x1="540" y1="210" x2="540" y2="216" stroke="#333" stroke-width="0.8"/>
  <text x="430" y="228" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" font-family="Microsoft YaHei, SimHei, sans-serif">20</text>
  
  <line x1="555" y1="85" x2="555" y2="195" stroke="#333" stroke-width="0.8"/>
  <line x1="552" y1="85" x2="558" y2="85" stroke="#333" stroke-width="0.8"/>
  <line x1="552" y1="195" x2="558" y2="195" stroke="#333" stroke-width="0.8"/>
  <text x="565" y="145" text-anchor="start" font-size="13" fill="#333" font-weight="bold" font-family="Microsoft YaHei, SimHei, sans-serif">15</text>
  
  <!-- 图例 -->
  <line x1="320" y1="238" x2="350" y2="238" stroke="#1a1a1a" stroke-width="2"/>
  <text x="355" y="242" font-size="11" fill="#666" font-family="Microsoft YaHei, SimHei, sans-serif">没移动/外框（实线）</text>
  <line x1="470" y1="238" x2="500" y2="238" stroke="#1a1a1a" stroke-width="2" stroke-dasharray="7 4"/>
  <text x="505" y="242" font-size="11" fill="#666" font-family="Microsoft YaHei, SimHei, sans-serif">移到外框的原位（虚线）</text>
</svg>