<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 380" width="440" height="380">
  <style>
    text { font-family: "Times New Roman", SimSun, serif; font-size: 16px; font-style: italic; fill: #333; }
  </style>
  <defs>
    <pattern id="shABC" width="7" height="7" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <rect width="7" height="7" fill="#d8d8d8"/>
      <line x1="0" y1="0" x2="0" y2="7" stroke="#aaa" stroke-width="1.5"/>
    </pattern>
    <pattern id="shGCD" width="7" height="7" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <rect width="7" height="7" fill="#999"/>
      <line x1="0" y1="0" x2="0" y2="7" stroke="#555" stroke-width="1.8"/>
    </pattern>
  </defs>

  <!-- 正方形 CDEF：E左上 D右上 C右下 F左下 -->
  <rect x="80" y="50" width="280" height="280" fill="none" stroke="#333" stroke-width="2.2"/>

  <!-- △ABC（浅阴影，已知面积8） -->
  <polygon points="120,50 80,165 360,330" fill="url(#shABC)" stroke="#333" stroke-width="1.5"/>

  <!-- △GCD（深阴影，待求）：G在AC与BI交点 -->
  <!-- AC: A(120,50)→C(360,330)；BI: y=165 → x=120+(360-120)*(165-50)/(330-50)=120+240*115/280≈218.6 -->
  <polygon points="219,165 360,330 360,50" fill="url(#shGCD)" stroke="#333" stroke-width="1.5"/>

  <!-- BI 水平 -->
  <line x1="80" y1="165" x2="360" y2="165" stroke="#333" stroke-width="1.4" stroke-dasharray="5,3"/>

  <!-- 关键点 -->
  <circle cx="120" cy="50" r="4" fill="#333"/>
  <circle cx="80" cy="165" r="4" fill="#333"/>
  <circle cx="219" cy="165" r="4" fill="#333"/>
  <circle cx="360" cy="165" r="4" fill="#333"/>

  <!-- 字母 -->
  <text x="68" y="48" text-anchor="end">E</text>
  <text x="120" y="38" text-anchor="middle">A</text>
  <text x="372" y="48" text-anchor="start">D</text>
  <text x="68" y="172" text-anchor="end">B</text>
  <text x="219" y="155" text-anchor="middle">G</text>
  <text x="372" y="172" text-anchor="start">I</text>
  <text x="68" y="348" text-anchor="end">F</text>
  <text x="372" y="348" text-anchor="start">C</text>
</svg>
