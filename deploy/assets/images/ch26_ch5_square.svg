<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 360" width="420" height="360">
  <style>
    text { font-family: "Times New Roman", SimSun, serif; font-size: 16px; font-style: italic; fill: #333; }
  </style>
  <defs>
    <pattern id="sh1" width="6" height="6" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <rect width="6" height="6" fill="#bbb"/>
      <line x1="0" y1="0" x2="0" y2="6" stroke="#777" stroke-width="1.5"/>
    </pattern>
    <pattern id="sh2" width="6" height="6" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <rect width="6" height="6" fill="#888"/>
      <line x1="0" y1="0" x2="0" y2="6" stroke="#444" stroke-width="1.8"/>
    </pattern>
  </defs>

  <!-- 正方形 CDEF：E左上、D右上、C右下、F左下 -->
  <rect x="70" y="50" width="260" height="260" fill="none" stroke="#333" stroke-width="2"/>

  <!-- A 在 ED 上，B 在 EF 上 -->
  <circle cx="120" cy="50" r="3.5" fill="#333"/>
  <circle cx="70" cy="130" r="3.5" fill="#333"/>
  <!-- BI 水平，I 在 DC 上 -->
  <line x1="70" y1="130" x2="330" y2="130" stroke="#333" stroke-width="1.4" stroke-dasharray="5,3"/>
  <circle cx="330" cy="130" r="3.5" fill="#333"/>

  <!-- G 在 BI 上（AC 与 BI 交点附近） -->
  <!-- AC: A(120,50)→C(330,310)；BI: y=130 → x = 120 + (330-120)*(130-50)/(310-50) = 120+210*80/260≈184.6 -->
  <circle cx="185" cy="130" r="3.5" fill="#333"/>

  <!-- 三角形 ABC -->
  <polygon points="120,50 70,130 330,310" fill="url(#sh1)" stroke="#333" stroke-width="1.4"/>

  <!-- 三角形 GCD（更深） -->
  <polygon points="185,130 330,310 330,50" fill="url(#sh2)" stroke="#333" stroke-width="1.4"/>

  <!-- 字母 -->
  <text x="60" y="48" text-anchor="end">E</text>
  <text x="120" y="40" text-anchor="middle">A</text>
  <text x="340" y="48" text-anchor="start">D</text>
  <text x="60" y="138" text-anchor="end">B</text>
  <text x="185" y="122" text-anchor="middle">G</text>
  <text x="340" y="138" text-anchor="start">I</text>
  <text x="60" y="328" text-anchor="end">F</text>
  <text x="340" y="328" text-anchor="start">C</text>
</svg>
