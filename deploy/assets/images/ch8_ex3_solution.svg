<svg xmlns="http://www.w3.org/2000/svg" width="500" height="350" viewBox="0 0 500 350">
  <rect width="500" height="350" fill="#fff"/>
  
  <!-- 河岸CD（上岸） -->
  <line x1="50" y1="120" x2="450" y2="120" stroke="#333" stroke-width="2"/>
  <text x="40" y="125" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">C</text>
  <text x="460" y="125" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">D</text>
  
  <!-- 河岸EF（下岸） -->
  <line x1="50" y1="220" x2="450" y2="220" stroke="#333" stroke-width="2"/>
  <text x="40" y="225" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">E</text>
  <text x="460" y="225" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">F</text>
  
  <!-- 河流 -->
  <rect x="50" y="120" width="400" height="100" fill="#b3d9ff" opacity="0.3"/>
  
  <!-- 村镇A（左岸上方） -->
  <circle cx="120" cy="80" r="15" fill="#e74c3c"/>
  <text x="120" y="75" text-anchor="middle" font-size="14" fill="#fff" font-weight="bold">A</text>
  
  <!-- 村镇B（右岸下方） -->
  <circle cx="380" cy="260" r="15" fill="#e74c3c"/>
  <text x="380" y="275" text-anchor="middle" font-size="14" fill="#fff" font-weight="bold">B</text>
  
  <!-- A₁（A向下平移河宽100单位，到y=180） -->
  <circle cx="120" cy="180" r="12" fill="#e74c3c" opacity="0.6"/>
  <text x="120" y="200" text-anchor="middle" font-size="12" fill="#e74c3c" font-weight="bold">A₁</text>
  
  <!-- AA₁（平移线段，虚线） -->
  <line x1="120" y1="95" x2="120" y2="165" stroke="#e74c3c" stroke-width="1.5" stroke-dasharray="4,4"/>
  
  <!-- A₁B连线（实线，经过N点） -->
  <line x1="120" y1="180" x2="380" y2="260" stroke="#e74c3c" stroke-width="2"/>
  
  <!-- 交点N（A₁B与EF的交点） -->
  <circle cx="250" cy="220" r="8" fill="#27ae60"/>
  <text x="250" y="245" text-anchor="middle" font-size="12" fill="#27ae60" font-weight="bold">N</text>
  
  <!-- M点（CD上，N的正上方） -->
  <circle cx="250" cy="120" r="8" fill="#27ae60"/>
  <text x="250" y="110" text-anchor="middle" font-size="12" fill="#27ae60" font-weight="bold">M</text>
  
  <!-- 桥MN（垂直于河岸） -->
  <rect x="246" y="120" width="8" height="100" fill="#e67e22" stroke="#d35400" stroke-width="1"/>
  
  <!-- 最短路径 A→M→N→B -->
  <path d="M120,80 L250,120 L250,220 L380,260" fill="none" stroke="#3498db" stroke-width="2.5"/>
  
  <!-- 说明 -->
  <text x="250" y="310" text-anchor="middle" font-size="13" fill="#333">第一步：将A向下平移河的宽度至A₁</text>
  <text x="250" y="330" text-anchor="middle" font-size="13" fill="#333">第二步：连结A₁B与EF相交于点N，作MN⊥CD</text>
  <text x="250" y="345" text-anchor="middle" font-size="13" fill="#27ae60" font-weight="bold">最短路程 = AM + MN + NB = AA₁ + A₁B</text>
</svg>
