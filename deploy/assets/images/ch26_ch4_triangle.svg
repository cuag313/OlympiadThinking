<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" width="520" height="300">
  <style>
    text { font-family: "Times New Roman", SimSun, serif; font-size: 16px; font-style: italic; fill: #333; }
  </style>
  <defs>
    <pattern id="hatchH" width="6" height="6" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <rect width="6" height="6" fill="#d0d0d0"/>
      <line x1="0" y1="0" x2="0" y2="6" stroke="#888" stroke-width="1.6"/>
    </pattern>
  </defs>

  <!-- 长方形 ABCD -->
  <rect x="60" y="40" width="400" height="200" fill="none" stroke="#333" stroke-width="2"/>

  <!-- 底边上的点 B F E G C -->
  <circle cx="60" cy="240" r="3.5" fill="#333"/>
  <circle cx="140" cy="240" r="3.5" fill="#333"/>
  <circle cx="250" cy="240" r="3.5" fill="#333"/>
  <circle cx="360" cy="240" r="3.5" fill="#333"/>
  <circle cx="460" cy="240" r="3.5" fill="#333"/>

  <!-- H 在 AD 上 -->
  <circle cx="260" cy="40" r="3.5" fill="#333"/>

  <!-- 三角形 HFG（阴影） -->
  <polygon points="260,40 140,240 360,240" fill="url(#hatchH)" stroke="#333" stroke-width="1.8"/>

  <!-- 字母 -->
  <text x="50" y="44" text-anchor="end">A</text>
  <text x="260" y="30" text-anchor="middle">H</text>
  <text x="470" y="44" text-anchor="start">D</text>
  <text x="50" y="258" text-anchor="end">B</text>
  <text x="140" y="268" text-anchor="middle">F</text>
  <text x="250" y="268" text-anchor="middle">E</text>
  <text x="360" y="268" text-anchor="middle">G</text>
  <text x="470" y="258" text-anchor="start">C</text>
</svg>
