<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 260" font-family="Microsoft YaHei, sans-serif">
  <!-- Outer triangle: A(150,20) B(20,240) C(280,240) -->
  <polygon points="150,20 20,240 280,240" fill="none" stroke="#333" stroke-width="2"/>
  <!-- Vertical altitude from A to base: D=(150,240) -->
  <line x1="150" y1="20" x2="150" y2="240" stroke="#333" stroke-width="1.5"/>
  <!-- Horizontal at y=120: E=(90.9,120) F=(209.1,120) -->
  <line x1="90.9" y1="120" x2="209.1" y2="120" stroke="#333" stroke-width="1.5"/>
  <!-- Vertical from E down to base G=(90.9,240) -->
  <line x1="90.9" y1="120" x2="90.9" y2="240" stroke="#333" stroke-width="1.5"/>
  <!-- Vertical from F down to base H=(209.1,240) -->
  <line x1="209.1" y1="120" x2="209.1" y2="240" stroke="#333" stroke-width="1.5"/>
  <!-- Diagonal G(90.9,240) to F(209.1,120) -->
  <line x1="90.9" y1="240" x2="209.1" y2="120" stroke="#333" stroke-width="1.5"/>
</svg>
