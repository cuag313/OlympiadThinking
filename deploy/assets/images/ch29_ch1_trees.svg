<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="500" height="120">
  <style>
    text { font-family: SimSun, "Microsoft YaHei", serif; font-size: 14px; fill: #333; }
  </style>
  <!-- 情况1：两侧 -->
  <text x="120" y="22" text-anchor="middle">图1 两侧</text>
  <line x1="30" y1="55" x2="210" y2="55" stroke="#333" stroke-width="2"/>
  <circle cx="30" cy="55" r="6" fill="#2e7d32"/>
  <circle cx="120" cy="55" r="6" fill="#f9a825"/>
  <circle cx="210" cy="55" r="6" fill="#1565c0"/>
  <text x="30" y="80" text-anchor="middle">银杏</text>
  <text x="120" y="80" text-anchor="middle">梧桐</text>
  <text x="210" y="80" text-anchor="middle">柳树</text>
  <text x="75" y="42" text-anchor="middle">180</text>
  <text x="165" y="42" text-anchor="middle">90</text>
  <text x="120" y="105" text-anchor="middle">相距270米</text>

  <!-- 情况2：同侧 -->
  <text x="370" y="22" text-anchor="middle">图2 同侧</text>
  <line x1="280" y1="55" x2="460" y2="55" stroke="#333" stroke-width="2"/>
  <circle cx="300" cy="55" r="6" fill="#f9a825"/>
  <circle cx="390" cy="55" r="6" fill="#1565c0"/>
  <circle cx="460" cy="55" r="6" fill="#2e7d32"/>
  <text x="300" y="80" text-anchor="middle">梧桐</text>
  <text x="390" y="80" text-anchor="middle">柳树</text>
  <text x="460" y="80" text-anchor="middle">银杏</text>
  <text x="345" y="42" text-anchor="middle">90</text>
  <text x="300" y="42" text-anchor="middle">180</text>
  <text x="370" y="105" text-anchor="middle">相距90米</text>
</svg>
