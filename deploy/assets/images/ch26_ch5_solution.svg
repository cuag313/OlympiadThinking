<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 380" width="420" height="380">
  <style>
    text { font-family: "Times New Roman", SimSun, serif; font-size: 16px; font-style: italic; fill: #333; }
  </style>
  <defs>
    <pattern id="sh1b" width="6" height="6" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <rect width="6" height="6" fill="#bbb"/>
      <line x1="0" y1="0" x2="0" y2="6" stroke="#777" stroke-width="1.5"/>
    </pattern>
    <pattern id="sh2b" width="6" height="6" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <rect width="6" height="6" fill="#888"/>
      <line x1="0" y1="0" x2="0" y2="6" stroke="#444" stroke-width="1.8"/>
    </pattern>
  </defs>

  <!-- 正方形 CDEF -->
  <rect x="70" y="50" width="260" height="260" fill="none" stroke="#333" stroke-width="2"/>

  <!-- 三角形 ABC -->
  <polygon points="120,50 70,130 330,310" fill="url(#sh1b)" stroke="#333" stroke-width="1.4"/>
  <!-- 三角形 GCD -->
  <polygon points="185,130 330,310 330,50" fill="url(#sh2b)" stroke="#333" stroke-width="1.4"/>

  <!-- BI 水平（画在三角之上，确保可见） -->
  <line x1="70" y1="130" x2="330" y2="130" stroke="#1a5276" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="250" y="122" text-anchor="middle" fill="#1a5276">BI</text>

  <!-- 过 G 作 BI 的垂线 LM -->
  <line x1="185" y1="50" x2="185" y2="310" stroke="#e03a3a" stroke-width="1.8" stroke-dasharray="6,4"/>

  <!-- 关键点 -->
  <circle cx="120" cy="50" r="3.5" fill="#333"/>
  <circle cx="70" cy="130" r="3.5" fill="#333"/>
  <circle cx="330" cy="130" r="3.5" fill="#333"/>
  <circle cx="185" cy="130" r="4" fill="#e03a3a"/>
  <circle cx="185" cy="50" r="3.5" fill="#e03a3a"/>
  <circle cx="185" cy="310" r="3.5" fill="#e03a3a"/>

  <!-- 字母 -->
  <text x="60" y="48" text-anchor="end">E</text>
  <text x="120" y="40" text-anchor="middle">A</text>
  <text x="198" y="42" text-anchor="start" fill="#e03a3a">L</text>
  <text x="340" y="48" text-anchor="start">D</text>
  <text x="60" y="138" text-anchor="end">B</text>
  <text x="175" y="128" text-anchor="end" fill="#e03a3a">G</text>
  <text x="340" y="138" text-anchor="start">I</text>
  <text x="60" y="328" text-anchor="end">F</text>
  <text x="198" y="336" text-anchor="start" fill="#e03a3a">M</text>
  <text x="340" y="328" text-anchor="start">C</text>
</svg>
