  <!-- 第9张 ?/5 -->
  <g transform="translate(464,28)">
    <rect x="0" y="0" width="44" height="104" rx="3" fill="#fff8e6" stroke="#e67e22" stroke-width="2"/>
    <line x1="0" y1="52" x2="44" y2="52" stroke="#e67e22" stroke-width="1.5"/>
    <text x="22" y="32" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="22" font-weight="bold" fill="#e67e22">?</text>
    <circle cx="12" cy="62" r="3.2" fill="#222"/>
    <circle cx="32" cy="62" r="3.2" fill="#222"/>
    <circle cx="22" cy="76" r="3.2" fill="#222"/>
    <circle cx="12" cy="90" r="3.2" fill="#222"/>
    <circle cx="32" cy="90" r="3.2" fill="#222"/>
