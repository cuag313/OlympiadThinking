<svg xmlns="http://www.w3.org/2000/svg" width="720" height="170" viewBox="0 0 720 170">
  <rect width="720" height="170" fill="#f5f5f5"/>

  <!-- 多米诺：竖排，上半/下半 -->
  <defs>
    <!-- 点位（半格局部坐标，半格约 44x52，中心 22,26） -->
  </defs>

  <!-- 生成说明：上=面值 top，下=面值 bottom；和序列 3,2,5,4,7,6,9,8,?+5 -->
  <!-- 第1张 1/2 和3 -->
  <g transform="translate(16,28)">
    <rect x="0" y="0" width="44" height="104" rx="3" fill="#e8e8e8" stroke="#555" stroke-width="1.5"/>
    <line x1="0" y1="52" x2="44" y2="52" stroke="#555" stroke-width="1.5"/>
    <circle cx="22" cy="26" r="3.2" fill="#222"/>
    <circle cx="14" cy="40" r="3.2" fill="#222"/>
    <circle cx="30" cy="66" r="3.2" fill="#222"/>
  </g>

  <!-- 第2张 1/1 和2 -->
  <g transform="translate(72,28)">
    <rect x="0" y="0" width="44" height="104" rx="3" fill="#e8e8e8" stroke="#555" stroke-width="1.5"/>
    <line x1="0" y1="52" x2="44" y2="52" stroke="#555" stroke-width="1.5"/>
    <circle cx="22" cy="26" r="3.2" fill="#222"/>
    <circle cx="22" cy="78" r="3.2" fill="#222"/>
  </g>

  <!-- 第3张 1/4 和5 -->
  <g transform="translate(128,28)">
    <rect x="0" y="0" width="44" height="104" rx="3" fill="#e8e8e8" stroke="#555" stroke-width="1.5"/>
    <line x1="0" y1="52" x2="44" y2="52" stroke="#555" stroke-width="1.5"/>
    <circle cx="22" cy="26" r="3.2" fill="#222"/>
    <circle cx="12" cy="64" r="3.2" fill="#222"/>
    <circle cx="32" cy="64" r="3.2" fill="#222"/>
    <circle cx="12" cy="90" r="3.2" fill="#222"/>
    <circle cx="32" cy="90" r="3.2" fill="#222"/>
  </g>

  <!-- 第4张 2/2 和4 -->
  <g transform="translate(184,28)">
    <rect x="0" y="0" width="44" height="104" rx="3" fill="#e8e8e8" stroke="#555" stroke-width="1.5"/>
    <line x1="0" y1="52" x2="44" y2="52" stroke="#555" stroke-width="1.5"/>
    <circle cx="12" cy="16" r="3.2" fill="#222"/>
    <circle cx="32" cy="36" r="3.2" fill="#222"/>
    <circle cx="12" cy="68" r="3.2" fill="#222"/>
    <circle cx="32" cy="88" r="3.2" fill="#222"/>
  </g>

  <!-- 第5张 4/3 和7 -->
  <g transform="translate(240,28)">
    <rect x="0" y="0" width="44" height="104" rx="3" fill="#e8e8e8" stroke="#555" stroke-width="1.5"/>
    <line x1="0" y1="52" x2="44" y2="52" stroke="#555" stroke-width="1.5"/>
    <circle cx="12" cy="14" r="3.2" fill="#222"/>
    <circle cx="32" cy="14" r="3.2" fill="#222"/>
    <circle cx="12" cy="38" r="3.2" fill="#222"/>
    <circle cx="32" cy="38" r="3.2" fill="#222"/>
    <circle cx="22" cy="66" r="3.2" fill="#222"/>
    <circle cx="12" cy="90" r="3.2" fill="#222"/>
    <circle cx="32" cy="90" r="3.2" fill="#222"/>
