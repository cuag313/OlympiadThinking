  <text x="486" y="22" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="12" fill="#e67e22" font-weight="bold">第9张</text>
  <text x="360" y="158" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="13" fill="#2c3e50">多米诺骨牌按规律排列（求第9张上半点数）</text>
</svg>
