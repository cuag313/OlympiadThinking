    <circle cx="22" cy="76" r="3.2" fill="#222"/>
    <circle cx="12" cy="90" r="3.2" fill="#222"/>
    <circle cx="32" cy="90" r="3.2" fill="#222"/>
  </g>

  <!-- 第8张 3/5 和8 -->
  <g transform="translate(408,28)">
    <rect x="0" y="0" width="44" height="104" rx="3" fill="#e8e8e8" stroke="#555" stroke-width="1.5"/>
    <line x1="0" y1="52" x2="44" y2="52" stroke="#555" stroke-width="1.5"/>
    <circle cx="22" cy="14" r="3.2" fill="#222"/>
    <circle cx="12" cy="38" r="3.2" fill="#222"/>
    <circle cx="32" cy="38" r="3.2" fill="#222"/>
    <circle cx="12" cy="62" r="3.2" fill="#222"/>
    <circle cx="32" cy="62" r="3.2" fill="#222"/>
    <circle cx="22" cy="76" r="3.2" fill="#222"/>
    <circle cx="12" cy="90" r="3.2" fill="#222"/>
    <circle cx="32" cy="90" r="3.2" fill="#222"/>
