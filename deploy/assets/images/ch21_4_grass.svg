<text x="190.0" y="210" text-anchor="middle" font-size="14.5" fill="#2c3e50" font-weight="bold">23头牛 × 9周 = 207份</text>
<path d="M340,120 l30,0 l-8,-7 M370,120 l-8,7" stroke="#e67e22" stroke-width="2.4" fill="none"/>
