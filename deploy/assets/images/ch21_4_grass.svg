<rect x="390" y="80" width="230" height="80" rx="8" fill="#fff" stroke="#e67e22" stroke-width="1.6" stroke-dasharray="6,4"/>
<text x="505" y="108" text-anchor="middle" font-size="13" fill="#c0392b" font-weight="bold">相差 207−162 = 45（份）</text>
<text x="505" y="130" text-anchor="middle" font-size="13" fill="#c0392b" font-weight="bold">时间相差 9−6 = 3（周）</text>
<text x="505" y="152" text-anchor="middle" font-size="13" fill="#c0392b" font-weight="bold">每周长草 45÷3 = 15（份）</text>
<rect x="390" y="190" width="230" height="60" rx="8" fill="#fff" stroke="#27ae60" stroke-width="1.6" stroke-dasharray="6,4"/>
<text x="505" y="218" text-anchor="middle" font-size="13" fill="#1e8449" font-weight="bold">原有草 6×(27−15) = 72（份）</text>
<text x="505" y="240" text-anchor="middle" font-size="13" fill="#1e8449" font-weight="bold">21头牛可吃 72÷(21−15) = 12（周）</text>
