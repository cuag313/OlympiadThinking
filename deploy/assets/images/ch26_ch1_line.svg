<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 140" width="560" height="140">
  <style>
    text { font-family: "Times New Roman", SimSun, serif; font-size: 18px; font-style: italic; fill: #333; }
    .mid { font-size: 13px; font-style: normal; fill: #c0392b; }
    .lbl { font-size: 15px; fill: #2980b9; }
  </style>
  <rect x="0" y="0" width="560" height="140" fill="#d6d2cc"/>

  <!-- 主线段 AC -->
  <line x1="40" y1="70" x2="520" y2="70" stroke="#333" stroke-width="2.5"/>

  <!-- 点：A=40, D=280(AC中点), B=360, E=440(BC中点), C=520 -->
  <circle cx="40" cy="70" r="5" fill="#3030a0"/>
  <circle cx="280" cy="70" r="5" fill="#c0392b"/>
  <circle cx="360" cy="70" r="5" fill="#3030a0"/>
  <circle cx="440" cy="70" r="5" fill="#c0392b"/>
  <circle cx="520" cy="70" r="5" fill="#3030a0"/>

  <text x="40" y="100" text-anchor="middle">A</text>
  <text x="280" y="100" text-anchor="middle">D</text>
  <text x="360" y="100" text-anchor="middle">B</text>
  <text x="440" y="100" text-anchor="middle">E</text>
  <text x="520" y="100" text-anchor="middle">C</text>

  <!-- AD=DC 中点标记 -->
  <line x1="40" y1="48" x2="280" y2="48" stroke="#c0392b" stroke-width="1.2"/>
  <line x1="280" y1="48" x2="520" y2="48" stroke="#c0392b" stroke-width="1.2"/>
  <text x="160" y="40" text-anchor="middle" class="mid">AD = DC</text>
  <text x="400" y="40" text-anchor="middle" class="mid">D 为 AC 中点</text>

  <!-- BE=EC 中点标记 -->
  <line x1="360" y1="118" x2="440" y2="118" stroke="#c0392b" stroke-width="1.2"/>
  <line x1="440" y1="118" x2="520" y2="118" stroke="#c0392b" stroke-width="1.2"/>
  <text x="400" y="134" text-anchor="middle" class="mid">BE = EC</text>
  <text x="400" y="22" text-anchor="middle" class="mid">E 为 BC 中点</text>

  <!-- DE = 5cm -->
  <line x1="280" y1="70" x2="440" y2="70" stroke="#27ae60" stroke-width="4"/>
  <text x="360" y="62" text-anchor="middle" class="lbl">DE = 5cm</text>
</svg>
