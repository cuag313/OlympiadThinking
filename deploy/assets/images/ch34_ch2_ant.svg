<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 200" width="280" height="200">
  <g stroke="#333333" stroke-width="1.5" fill="none">
    <!-- rectangle 1: A top-left, B bottom-right -->
    <rect x="20" y="20" width="80" height="50"/>
    <!-- rectangle 2: B top-left, C bottom-right (B=100,70) -->
    <rect x="100" y="70" width="80" height="50"/>
    <!-- rectangle 3: C top-left, D bottom-right (C=180,120) -->
    <rect x="180" y="120" width="80" height="50"/>
    <!-- continuous diagonal A to D -->
    <line x1="20" y1="20" x2="260" y2="170"/>
  </g>
  <g font-family="Microsoft YaHei, sans-serif" font-size="18" fill="#e74c3c" font-weight="bold">
    <text x="8" y="22">A</text>
    <text x="92" y="68">B</text>
    <text x="172" y="118">C</text>
    <text x="260" y="175">D</text>
  </g>
</svg>
