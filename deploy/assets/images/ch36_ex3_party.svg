<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 220" width="420" height="220">
  <style>
    text { font-family: "Microsoft YaHei", SimHei, sans-serif; font-size: 14px; fill: #333; }
    .cap { font-size: 12px; fill: #555; }
  </style>

  <!-- 图1：6个点代表6个人 -->
  <g id="fig1">
    <text x="105" y="18" text-anchor="middle" class="cap">图1</text>
    <!-- A top -->
    <circle cx="105" cy="40" r="3.5" fill="#333"/>
    <text x="105" y="32" text-anchor="middle">A</text>
    <!-- B upper-left -->
    <circle cx="55" cy="78" r="3.5" fill="#333"/>
    <text x="42" y="78" text-anchor="middle">B</text>
    <!-- F upper-right -->
    <circle cx="155" cy="78" r="3.5" fill="#333"/>
    <text x="168" y="78" text-anchor="middle">F</text>
    <!-- C lower-left -->
    <circle cx="55" cy="130" r="3.5" fill="#333"/>
    <text x="42" y="134" text-anchor="middle">C</text>
    <!-- E lower-right -->
    <circle cx="155" cy="130" r="3.5" fill="#333"/>
    <text x="168" y="134" text-anchor="middle">E</text>
    <!-- D bottom -->
    <circle cx="105" cy="168" r="3.5" fill="#333"/>
    <text x="105" y="188" text-anchor="middle">D</text>
    <text x="105" y="208" text-anchor="middle" class="cap">6个点代表6个人</text>
  </g>

  <!-- 图2：同色三角形示意 -->
  <g id="fig2">
    <text x="310" y="18" text-anchor="middle" class="cap">图2</text>
    <!-- A top -->
    <circle cx="310" cy="48" r="3.5" fill="#333"/>
    <text x="310" y="38" text-anchor="middle">A</text>
    <!-- C left -->
    <circle cx="250" cy="130" r="3.5" fill="#333"/>
    <text x="236" y="134" text-anchor="middle">C</text>
    <!-- E right -->
    <circle cx="370" cy="130" r="3.5" fill="#333"/>
    <text x="384" y="134" text-anchor="middle">E</text>
    <!-- D bottom -->
    <circle cx="310" cy="178" r="3.5" fill="#333"/>
    <text x="310" y="198" text-anchor="middle">D</text>
    <!-- solid: AC, AE, AD (认识) -->
    <line x1="310" y1="48" x2="250" y2="130" stroke="#333" stroke-width="2"/>
    <line x1="310" y1="48" x2="370" y2="130" stroke="#333" stroke-width="2"/>
    <line x1="310" y1="48" x2="310" y2="178" stroke="#333" stroke-width="2"/>
    <!-- dashed: CE, CD, DE (不认识) -->
    <line x1="250" y1="130" x2="370" y2="130" stroke="#777" stroke-width="1.6" stroke-dasharray="5 4"/>
    <line x1="250" y1="130" x2="310" y2="178" stroke="#777" stroke-width="1.6" stroke-dasharray="5 4"/>
    <line x1="370" y1="130" x2="310" y2="178" stroke="#777" stroke-width="1.6" stroke-dasharray="5 4"/>
    <text x="310" y="218" text-anchor="middle" class="cap">实线=认识，虚线=不认识</text>
  </g>
</svg>
