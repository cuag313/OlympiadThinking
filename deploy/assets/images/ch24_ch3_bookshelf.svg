<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 250" width="500" height="250">
  <style>
    text { font-family: "Microsoft YaHei", Arial, sans-serif; font-size: 13px; }
    .label { font-weight: bold; font-size: 14px; }
    .part { font-size: 12px; }
  </style>
  
  <!-- 原来状态 -->
  <text x="30" y="30" class="label" fill="#e74c3c">原来：</text>
  
  <!-- 上层线段 -->
  <text x="90" y="55" class="label">上层</text>
  <line x1="130" y1="50" x2="380" y2="50" stroke="#e74c3c" stroke-width="12"/>
  <text x="255" y="45" text-anchor="middle" fill="white" font-weight="bold">5份</text>
  
  <!-- 下层线段 -->
  <text x="90" y="95" class="label">下层</text>
  <line x1="130" y1="90" x2="280" y2="90" stroke="#3498db" stroke-width="12"/>
  <text x="205" y="85" text-anchor="middle" fill="white" font-weight="bold">3份</text>
  
  <!-- 总数标注 -->
  <text x="250" y="120" text-anchor="middle" class="label">共160本</text>
  
  <!-- 操作说明 -->
  <text x="30" y="150" class="label" fill="#e67e22">操作：</text>
  <text x="80" y="150">上层的 1/5 放入下层</text>
  
  <!-- 箭头 -->
  <line x1="300" y1="55" x2="200" y2="85" stroke="#e67e22" stroke-width="2"/>
  <polygon points="205,80 195,85 205,90" fill="#e67e22"/>
  <text x="250" y="70" fill="#e67e22">1/5</text>
  
  <!-- 操作后状态 -->
  <text x="30" y="190" class="label" fill="#27ae60">操作后：</text>
  
  <!-- 上层（减少后） -->
  <text x="90" y="215" class="label">上层</text>
  <line x1="130" y1="210" x2="330" y2="210" stroke="#e74c3c" stroke-width="12"/>
  <text x="230" y="205" text-anchor="middle" fill="white" font-weight="bold">4份 = 80本</text>
  
  <!-- 下层（增加后） -->
  <text x="90" y="240" class="label">下层</text>
  <line x1="130" y1="235" x2="330" y2="235" stroke="#3498db" stroke-width="12"/>
  <text x="230" y="230" text-anchor="middle" fill="white" font-weight="bold">4份 = 80本</text>
  
  <!-- 相等标注 -->
  <text x="350" y="225" fill="#27ae60" font-weight="bold">相等</text>
</svg>