<svg xmlns="http://www.w3.org/2000/svg" width="500" height="250" viewBox="0 0 500 250">
  <rect width="500" height="250" fill="#f5f5f5"/>
  
  <!-- 鸡 -->
  <circle cx="100" cy="100" r="30" fill="#f39c12"/>
  <text x="100" y="105" text-anchor="middle" font-size="20" fill="#fff">鸡</text>
  <text x="100" y="150" text-anchor="middle" font-size="14" fill="#333">2只脚</text>
  
  <!-- 兔 -->
  <circle cx="300" cy="100" r="30" fill="#e74c3c"/>
  <text x="300" y="105" text-anchor="middle" font-size="20" fill="#fff">兔</text>
  <text x="300" y="150" text-anchor="middle" font-size="14" fill="#333">4只脚</text>
  
  <!-- 箭头 -->
  <line x1="150" y1="100" x2="250" y2="100" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- 标注 -->
  <text x="200" y="80" text-anchor="middle" font-size="14" fill="#333">假设全部是鸡</text>
  
  <!-- 头和脚的标注 -->
  <text x="200" y="200" text-anchor="middle" font-size="16" fill="#2c3e50" font-weight="bold">共10个头，28只脚</text>
  <text x="200" y="230" text-anchor="middle" font-size="14" fill="#666">鸡：6只，兔：4只</text>
  
  <!-- 箭头标记定义 -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#333"/>
    </marker>
  </defs>
</svg>
