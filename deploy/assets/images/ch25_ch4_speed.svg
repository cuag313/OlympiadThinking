<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 640" width="600" height="640">
  <style>
    text { font-family: SimSun, "Microsoft YaHei", serif; font-size: 14px; fill: #333; }
    .num { font-size: 13px; }
  </style>
  <defs>
    <pattern id="h5" width="7" height="7" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <rect width="7" height="7" fill="#dddddd"/>
      <line x1="0" y1="0" x2="0" y2="7" stroke="#9a9a9a" stroke-width="1.6"/>
    </pattern>
  </defs>

  <!-- ============ 上面板 ============ -->
  <!-- 前一段路程长方形 -->
  <rect x="120" y="60" width="240" height="170" fill="url(#h5)" stroke="#333" stroke-width="1.6"/>
  <text x="240" y="150" text-anchor="middle">前一段路程</text>
  <!-- 后一段路程长方形（较矮） -->
  <rect x="360" y="108" width="110" height="122" fill="url(#h5)" stroke="#333" stroke-width="1.6"/>
  <text x="415" y="168" text-anchor="middle" class="num">后一段</text>
  <text x="415" y="186" text-anchor="middle" class="num">路程</text>

  <!-- 左侧括号 350米/分钟 -->
  <line x1="98" y1="60" x2="98" y2="230" stroke="#333" stroke-width="1.2"/>
  <line x1="98" y1="60" x2="104" y2="60" stroke="#333" stroke-width="1.2"/>
  <line x1="98" y1="230" x2="104" y2="230" stroke="#333" stroke-width="1.2"/>
  <text x="92" y="140" text-anchor="end" class="num">350</text>
  <text x="92" y="157" text-anchor="end" class="num">米/分钟</text>

  <!-- 右侧括号 250米/分钟 -->
  <line x1="488" y1="108" x2="488" y2="230" stroke="#333" stroke-width="1.2"/>
  <line x1="482" y1="108" x2="488" y2="108" stroke="#333" stroke-width="1.2"/>
  <line x1="482" y1="230" x2="488" y2="230" stroke="#333" stroke-width="1.2"/>
  <text x="494" y="164" class="num">250</text>
  <text x="494" y="181" class="num">米/分钟</text>

  <!-- 底部括号 -->
  <path d="M 120 230 L 120 236 L 237 236 L 240 242 L 243 236 L 360 236 L 360 230" fill="none" stroke="#333" stroke-width="1.2"/>
  <text x="240" y="262" text-anchor="middle">前一段时间</text>
  <path d="M 360 230 L 360 236 L 412 236 L 415 242 L 418 236 L 470 236 L 470 230" fill="none" stroke="#333" stroke-width="1.2"/>
  <text x="415" y="262" text-anchor="middle" class="num">后一段时间</text>
  <path d="M 120 276 L 120 282 L 292 282 L 295 288 L 298 282 L 470 282 L 470 276" fill="none" stroke="#333" stroke-width="1.2"/>
  <text x="295" y="308" text-anchor="middle">共24分钟</text>

  <!-- ============ 下面板 ============ -->
  <g transform="translate(0,325)">
    <!-- 前一段路程长方形 -->
    <rect x="120" y="60" width="240" height="170" fill="url(#h5)" stroke="#333" stroke-width="1.6"/>
    <text x="240" y="150" text-anchor="middle">前一段路程</text>
    <!-- 后一段路程长方形（较矮） -->
    <rect x="360" y="108" width="110" height="122" fill="url(#h5)" stroke="#333" stroke-width="1.6"/>
    <text x="415" y="168" text-anchor="middle" class="num">后一段</text>
    <text x="415" y="186" text-anchor="middle" class="num">路程</text>
    <!-- 右上角补出的长方形（虚线） -->
    <rect x="360" y="60" width="110" height="48" fill="none" stroke="#333" stroke-width="1.4" stroke-dasharray="6,4"/>
    <text x="415" y="42" text-anchor="middle" class="num">8400−8000</text>
    <text x="415" y="87" text-anchor="middle" class="num">=400米</text>

    <!-- 左侧括号 350米/分钟 -->
    <line x1="98" y1="60" x2="98" y2="230" stroke="#333" stroke-width="1.2"/>
    <line x1="98" y1="60" x2="104" y2="60" stroke="#333" stroke-width="1.2"/>
    <line x1="98" y1="230" x2="104" y2="230" stroke="#333" stroke-width="1.2"/>
    <text x="92" y="140" text-anchor="end" class="num">350</text>
    <text x="92" y="157" text-anchor="end" class="num">米/分钟</text>

    <!-- 右侧两个括号：100米/分钟 + 250米/分钟 -->
    <line x1="488" y1="60" x2="488" y2="108" stroke="#333" stroke-width="1.2"/>
    <line x1="482" y1="60" x2="488" y2="60" stroke="#333" stroke-width="1.2"/>
    <line x1="482" y1="108" x2="488" y2="108" stroke="#333" stroke-width="1.2"/>
    <text x="494" y="80" class="num">100</text>
    <text x="494" y="96" class="num">米/分钟</text>
    <line x1="488" y1="108" x2="488" y2="230" stroke="#333" stroke-width="1.2"/>
    <line x1="482" y1="230" x2="488" y2="230" stroke="#333" stroke-width="1.2"/>
    <text x="494" y="164" class="num">250</text>
    <text x="494" y="181" class="num">米/分钟</text>

    <!-- 底部括号 -->
    <path d="M 120 230 L 120 236 L 237 236 L 240 242 L 243 236 L 360 236 L 360 230" fill="none" stroke="#333" stroke-width="1.2"/>
    <text x="240" y="262" text-anchor="middle">前一段时间</text>
    <path d="M 360 230 L 360 236 L 412 236 L 415 242 L 418 236 L 470 236 L 470 230" fill="none" stroke="#333" stroke-width="1.2"/>
    <text x="415" y="262" text-anchor="middle" class="num">后一段时间</text>
    <path d="M 120 276 L 120 282 L 292 282 L 295 288 L 298 282 L 470 282 L 470 276" fill="none" stroke="#333" stroke-width="1.2"/>
    <text x="295" y="308" text-anchor="middle">共24分钟</text>
  </g>
</svg>
