<svg xmlns="http://www.w3.org/2000/svg" width="560" height="240" viewBox="0 0 560 240">
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,3 L8,5 L0,7 L2,5 z" fill="#555"/>
</marker>
</defs>
<rect x="0" y="0" width="560" height="240" fill="#fdfefe" stroke="#d5dbdb" rx="10"/>
<text x="280.0" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#2c3e50" font-family="Microsoft YaHei, SimHei, sans-serif">图1：把四边形转化为两个三角形</text>
<text x="110" y="58" text-anchor="middle" font-size="13" fill="#7f8c8d" font-family="Microsoft YaHei, SimHei, sans-serif">原图：四边形（内角和未知）</text>
<polygon points="50,110 150,80 180,160 70,180" fill="#fdf3e7" stroke="#b06010" stroke-width="2.6"/>
<path d="M 210,130 l 50,0 l -10,-8 M 260,130 l -10,8" stroke="#e67e22" stroke-width="2.6" fill="none"/>
<text x="235" y="112" text-anchor="middle" font-size="12" fill="#e67e22" font-family="Microsoft YaHei, SimHei, sans-serif">连对角线</text>
<text x="400" y="58" text-anchor="middle" font-size="13" fill="#7f8c8d" font-family="Microsoft YaHei, SimHei, sans-serif">转化：两个三角形（内角和已知）</text>
<polygon points="320,110 420,80 450,160" fill="#d6eaf8" stroke="#2980b9" stroke-width="2.2"/>
<polygon points="320,110 450,160 340,180" fill="#fdebd0" stroke="#e67e22" stroke-width="2.2"/>
<line x1="320" y1="110" x2="450" y2="160" stroke="#c0392b" stroke-width="2" stroke-dasharray="6,4"/>
<text x="385" y="120" text-anchor="middle" font-size="12" fill="#2874a6" font-family="Microsoft YaHei, SimHei, sans-serif">180°</text>
<text x="385" y="165" text-anchor="middle" font-size="12" fill="#b9770e" font-family="Microsoft YaHei, SimHei, sans-serif">180°</text>
<text x="280" y="210" text-anchor="middle" font-size="14" font-weight="bold" fill="#27ae60" font-family="Microsoft YaHei, SimHei, sans-serif">四边形内角和 = 180° × 2 = 360°</text>
</svg>
