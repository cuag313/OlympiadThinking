<svg xmlns="http://www.w3.org/2000/svg" width="500" height="250" viewBox="0 0 500 250">
  <rect width="500" height="250" fill="#fff"/>
  
  <!-- 河岸CD（上岸） -->
  <line x1="50" y1="80" x2="450" y2="80" stroke="#333" stroke-width="2"/>
  <text x="40" y="85" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">C</text>
  <text x="460" y="85" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">D</text>
  
  <!-- 河岸EF（下岸） -->
  <line x1="50" y1="180" x2="450" y2="180" stroke="#333" stroke-width="2"/>
  <text x="40" y="185" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">E</text>
  <text x="460" y="185" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">F</text>
  
  <!-- 河流 -->
  <rect x="50" y="80" width="400" height="100" fill="#b3d9ff" opacity="0.3"/>
  
  <!-- 村镇A（左岸上方） -->
  <circle cx="150" cy="50" r="15" fill="#e74c3c"/>
  <text x="150" y="55" text-anchor="middle" font-size="14" fill="#fff" font-weight="bold">A</text>
  
  <!-- 村镇B（右岸下方） -->
  <circle cx="350" cy="210" r="15" fill="#e74c3c"/>
  <text x="350" y="215" text-anchor="middle" font-size="14" fill="#fff" font-weight="bold">B</text>
  
  <!-- 标注河流宽度 -->
  <line x1="250" y1="80" x2="250" y2="180" stroke="#666" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="260" y="135" text-anchor="middle" font-size="12" fill="#666">河宽</text>
</svg>
