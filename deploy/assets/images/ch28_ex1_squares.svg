<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420" width="520" height="420">
  <style>
    text { font-family: SimSun, "Microsoft YaHei", serif; fill: #222; }
    .lab { font-size: 18px; font-weight: bold; }
    .side { font-size: 15px; fill: #555; }
  </style>

  <!-- 长方形 13×11，单位=28px，原点(70,45)，宽364 高308 -->
  <!-- 6个正方形：7×7, 6×6, 1×1, 5×5, 4×4, 4×4 -->

  <!-- 7×7 左上：x70-266 y45-241 -->
  <rect x="70" y="45" width="196" height="196" fill="#eaf2fb" stroke="#222" stroke-width="1.8"/>
  <!-- 6×6 右上：x266-434 y45-213 -->
  <rect x="266" y="45" width="168" height="168" fill="#fdf2e9" stroke="#222" stroke-width="1.8"/>
  <!-- 1×1：x266-294 y213-241 -->
  <rect x="266" y="213" width="28" height="28" fill="#e8f8f5" stroke="#222" stroke-width="1.8"/>
  <!-- 5×5 右：x294-434 y213-353 -->
  <rect x="294" y="213" width="140" height="140" fill="#f9ebea" stroke="#222" stroke-width="1.8"/>
  <!-- 4×4 左下：x70-182 y241-353 -->
  <rect x="70" y="241" width="112" height="112" fill="#eafaf1" stroke="#222" stroke-width="1.8"/>
  <!-- 4×4 中下：x182-294 y241-353 -->
  <rect x="182" y="241" width="112" height="112" fill="#f4ecf7" stroke="#222" stroke-width="1.8"/>

  <!-- 外框 -->
  <rect x="70" y="45" width="364" height="308" fill="none" stroke="#222" stroke-width="2.4"/>

  <!-- 边长标注已移除（题干附图不写答案） -->

  <!-- 顶点字母：E左上 A上中 D右上 / B左中 G中 I右中 / F左下 C右下 -->
  <text x="55" y="38" text-anchor="end" class="lab">E</text>
  <text x="266" y="36" text-anchor="middle" class="lab">A</text>
  <text x="450" y="38" text-anchor="start" class="lab">D</text>
  <text x="55" y="232" text-anchor="end" class="lab">B</text>
  <text x="280" y="200" text-anchor="middle" class="lab">G</text>
  <text x="450" y="222" text-anchor="start" class="lab">I</text>
  <text x="55" y="372" text-anchor="end" class="lab">F</text>
  <text x="450" y="372" text-anchor="start" class="lab">C</text>
</svg>
