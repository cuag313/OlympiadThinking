<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" width="480" height="320">
  <style>
    text { font-family: SimSun, "Microsoft YaHei", serif; font-size: 14px; fill: #333; }
    .n { font-size: 16px; font-weight: bold; }
  </style>
  <!-- 外框长方形 -->
  <rect x="40" y="40" width="400" height="240" fill="none" stroke="#333" stroke-width="2.2"/>
  <!-- 内部6个正方形：最小面积1(边长1)，次小x=4 -->
  <!-- 布局仿原图：左列两个，中列上下，右列两个+一个 -->
  <!-- 左：小(1) + 中(5=4+1) -->
  <rect x="40" y="180" width="40" height="40" fill="#f4e5df" stroke="#8b4513" stroke-width="1.6"/>
  <text x="60" y="205" text-anchor="middle" class="n">1</text>
  <rect x="40" y="40" width="100" height="140" fill="#e8f0fe" stroke="#8b4513" stroke-width="1.6"/>
  <text x="90" y="115" text-anchor="middle" class="n">5</text>
  <!-- 中：7=4+3 -->
  <rect x="140" y="40" width="140" height="140" fill="#fff3cd" stroke="#8b4513" stroke-width="1.6"/>
  <text x="210" y="115" text-anchor="middle" class="n">7</text>
  <!-- 右上：6=4+2 -->
  <rect x="280" y="40" width="120" height="120" fill="#d4edda" stroke="#8b4513" stroke-width="1.6"/>
  <text x="340" y="105" text-anchor="middle" class="n">6</text>
  <!-- 右中：4 -->
  <rect x="280" y="160" width="80" height="80" fill="#f8d7da" stroke="#8b4513" stroke-width="1.6"/>
  <text x="320" y="205" text-anchor="middle" class="n">4</text>
  <!-- 右下 -->
  <rect x="360" y="160" width="80" height="80" fill="#e2e3e5" stroke="#8b4513" stroke-width="1.6"/>
  <text x="400" y="205" text-anchor="middle" class="n">8</text>
  <!-- 底部 -->
  <rect x="140" y="180" width="140" height="100" fill="#d1ecf1" stroke="#8b4513" stroke-width="1.6"/>
  <text x="210" y="235" text-anchor="middle" class="n">9</text>
  <rect x="40" y="220" width="100" height="60" fill="#fde2e2" stroke="#8b4513" stroke-width="1.6"/>
  <text x="90" y="255" text-anchor="middle" class="n">3</text>
</svg>
