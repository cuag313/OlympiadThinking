<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 170" width="520" height="170">
  <style>
    text { font-family: "Microsoft YaHei", Arial, sans-serif; font-size: 14px; }
    .name { font-weight: bold; fill: #333; }
    .cap { font-size: 13px; fill: #555; }
  </style>

  <!-- 灰底（仿原书） -->
  <rect x="0" y="0" width="520" height="170" fill="#d6d2cc"/>

  <!-- 思思行：过多少年 | 5岁 -->
  <text x="55" y="72" text-anchor="end" class="name">思思</text>
  <text x="125" y="40" text-anchor="middle" class="cap">过多少年</text>
  <text x="205" y="40" text-anchor="middle" class="cap">5岁</text>
  <rect x="70" y="48" width="110" height="20" fill="white" stroke="#555" stroke-width="1.5"/>
  <rect x="180" y="48" width="50" height="20" fill="white" stroke="#555" stroke-width="1.5"/>

  <!-- 爸爸行：1份 | 2份 -->
  <text x="55" y="112" text-anchor="end" class="name">爸爸</text>
  <rect x="70" y="88" width="160" height="20" fill="white" stroke="#555" stroke-width="1.5"/>
  <rect x="230" y="88" width="260" height="20" fill="white" stroke="#555" stroke-width="1.5"/>
  <!-- 爸爸条上的刻度 -->
  <line x1="122.5" y1="92" x2="122.5" y2="104" stroke="#555" stroke-width="1"/>
  <line x1="175" y1="92" x2="175" y2="104" stroke="#555" stroke-width="1"/>
  <line x1="295" y1="92" x2="295" y2="104" stroke="#555" stroke-width="1"/>
  <line x1="360" y1="92" x2="360" y2="104" stroke="#555" stroke-width="1"/>
  <line x1="425" y1="92" x2="425" y2="104" stroke="#555" stroke-width="1"/>

  <!-- 份数标注 -->
  <text x="150" y="135" text-anchor="middle" class="name">1份</text>
  <text x="360" y="135" text-anchor="middle" class="name">2份</text>

  <!-- 思思右端与爸爸1份末端的竖直虚线对齐线 -->
  <line x1="230" y1="68" x2="230" y2="88" stroke="#555" stroke-width="1" stroke-dasharray="4,3"/>
</svg>
