<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" width="480" height="200">
  <style>
    text { font-family: SimSun, "Microsoft YaHei", serif; font-size: 12px; fill: #333; }
    .n { font-size: 13px; font-weight: bold; fill: #b35a00; }
  </style>
  <rect x="0" y="0" width="480" height="200" fill="#fafafa" stroke="#ddd"/>
  <!-- n=1: 1 dot -->
  <text x="50" y="28" text-anchor="middle">n=1</text>
  <circle cx="50" cy="55" r="5" fill="#e07030"/>
  <text x="50" y="80" text-anchor="middle" class="n">1</text>
  <!-- n=2: 3 L around -->
  <text x="150" y="28" text-anchor="middle">n=2</text>
  <circle cx="135" cy="55" r="5" fill="#e07030"/>
  <circle cx="150" cy="55" r="5" fill="#c04020"/>
  <circle cx="150" cy="70" r="5" fill="#c04020"/>
  <text x="150" y="95" text-anchor="middle" class="n">1+3</text>
  <!-- n=3 -->
  <text x="270" y="28" text-anchor="middle">n=3</text>
  <circle cx="250" cy="55" r="5" fill="#e07030"/>
  <circle cx="265" cy="55" r="5" fill="#c04020"/>
  <circle cx="265" cy="70" r="5" fill="#c04020"/>
  <circle cx="280" cy="55" r="5" fill="#803020"/>
  <circle cx="280" cy="70" r="5" fill="#803020"/>
  <circle cx="280" cy="85" r="5" fill="#803020"/>
  <text x="270" y="110" text-anchor="middle" class="n">1+3+5</text>
  <!-- n=4 -->
  <text x="400" y="28" text-anchor="middle">n=4</text>
  <circle cx="375" cy="55" r="5" fill="#e07030"/>
  <circle cx="390" cy="55" r="5" fill="#c04020"/>
  <circle cx="390" cy="70" r="5" fill="#c04020"/>
  <circle cx="405" cy="55" r="5" fill="#803020"/>
  <circle cx="405" cy="70" r="5" fill="#803020"/>
  <circle cx="405" cy="85" r="5" fill="#803020"/>
  <circle cx="420" cy="55" r="5" fill="#402020"/>
  <circle cx="420" cy="70" r="5" fill="#402020"/>
  <circle cx="420" cy="85" r="5" fill="#402020"/>
  <circle cx="420" cy="100" r="5" fill="#402020"/>
  <text x="400" y="125" text-anchor="middle" class="n">1+3+5+7</text>
  <text x="240" y="175" text-anchor="middle" fill="#555">从一点出发，按 L 形划分出 3, 5, 7, …, 2n−1</text>
</svg>