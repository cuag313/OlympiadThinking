<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 340" width="420" height="340">
  <style>
    text { font-family: SimSun, "Microsoft YaHei", serif; font-size: 14px; fill: #333; }
    .sum { font-size: 16px; fill: #e03a3a; font-weight: bold; }
  </style>
  <!-- 钢管堆：4层圆球，虚线连接 -->
  <!-- 第1层：1个 -->
  <circle cx="210" cy="50" r="20" fill="#b0c4de" stroke="#444" stroke-width="1.8"/>
  <!-- 虚线连接1→2层 -->
  <line x1="200" y1="68" x2="178" y2="90" stroke="#888" stroke-width="1.2" stroke-dasharray="4,3"/>
  <line x1="220" y1="68" x2="242" y2="90" stroke="#888" stroke-width="1.2" stroke-dasharray="4,3"/>
  <!-- 第2层：2个 -->
  <circle cx="160" cy="110" r="20" fill="#b0c4de" stroke="#444" stroke-width="1.8"/>
  <circle cx="260" cy="110" r="20" fill="#b0c4de" stroke="#444" stroke-width="1.8"/>
  <!-- 虚线连接2→3层 -->
  <line x1="150" y1="128" x2="128" y2="150" stroke="#888" stroke-width="1.2" stroke-dasharray="4,3"/>
  <line x1="170" y1="128" x2="192" y2="150" stroke="#888" stroke-width="1.2" stroke-dasharray="4,3"/>
  <line x1="250" y1="128" x2="228" y2="150" stroke="#888" stroke-width="1.2" stroke-dasharray="4,3"/>
  <line x1="270" y1="128" x2="292" y2="150" stroke="#888" stroke-width="1.2" stroke-dasharray="4,3"/>
  <!-- 第3层：3个 -->
  <circle cx="110" cy="170" r="20" fill="#b0c4de" stroke="#444" stroke-width="1.8"/>
  <circle cx="210" cy="170" r="20" fill="#b0c4de" stroke="#444" stroke-width="1.8"/>
  <circle cx="310" cy="170" r="20" fill="#b0c4de" stroke="#444" stroke-width="1.8"/>
  <!-- 虚线连接3→4层 -->
  <line x1="100" y1="188" x2="78" y2="210" stroke="#888" stroke-width="1.2" stroke-dasharray="4,3"/>
  <line x1="120" y1="188" x2="142" y2="210" stroke="#888" stroke-width="1.2" stroke-dasharray="4,3"/>
  <line x1="200" y1="188" x2="178" y2="210" stroke="#888" stroke-width="1.2" stroke-dasharray="4,3"/>
  <line x1="220" y1="188" x2="242" y2="210" stroke="#888" stroke-width="1.2" stroke-dasharray="4,3"/>
  <line x1="300" y1="188" x2="278" y2="210" stroke="#888" stroke-width="1.2" stroke-dasharray="4,3"/>
  <line x1="320" y1="188" x2="342" y2="210" stroke="#888" stroke-width="1.2" stroke-dasharray="4,3"/>
  <!-- 第4层：4个 -->
  <circle cx="60" cy="230" r="20" fill="#b0c4de" stroke="#444" stroke-width="1.8"/>
  <circle cx="160" cy="230" r="20" fill="#b0c4de" stroke="#444" stroke-width="1.8"/>
  <circle cx="260" cy="230" r="20" fill="#b0c4de" stroke="#444" stroke-width="1.8"/>
  <circle cx="360" cy="230" r="20" fill="#b0c4de" stroke="#444" stroke-width="1.8"/>
  <!-- 省略号表示继续 -->
  <text x="210" y="275" text-anchor="middle" font-size="24" fill="#888">⋯</text>
  <!-- 说明文字 -->
  <text x="210" y="310" text-anchor="middle">共 n 层，每层依次 1,2,3,…,n 根</text>
</svg>