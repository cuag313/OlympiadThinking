<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 280">
  <!-- 四边形 ABCD: AB短, AD次之, BC第三, DC最长 -->
  <!-- A(90,50) B(175,50) C(300,230) D(40,230) -->
  <polygon points="90,50 175,50 300,230 40,230" fill="none" stroke="#1a5276" stroke-width="2.4"/>
  <!-- 三等分点 -->
  <!-- M,N on AB: M(118,50) N(147,50) -->
  <!-- O,P on DC: O(127,230) P(213,230) -->
  <!-- J,I on AD: J(73,110) I(57,170) -->
  <!-- K,L on BC: K(217,110) L(258,170) -->
  <!-- 水平连线 J-K, I-L -->
  <line x1="73" y1="110" x2="217" y2="110" stroke="#1a5276" stroke-width="1.6"/>
  <line x1="57" y1="170" x2="258" y2="170" stroke="#1a5276" stroke-width="1.6"/>
  <!-- 竖向连线 M-O, N-P -->
  <line x1="118" y1="50" x2="127" y2="230" stroke="#1a5276" stroke-width="1.6"/>
  <line x1="147" y1="50" x2="213" y2="230" stroke="#1a5276" stroke-width="1.6"/>
  <!-- 真中心 EFGH -->
  <!-- E(121,110) F(169,110) G(191,170) H(124,170) -->
  <polygon points="121,110 169,110 191,170 124,170" fill="#7fb3d5" fill-opacity="0.65" stroke="#1a5276" stroke-width="1.8"/>
  <!-- 顶点 -->
  <text x="82" y="42" font-size="15" fill="#1a5276" font-family="sans-serif">A</text>
  <text x="177" y="42" font-size="15" fill="#1a5276" font-family="sans-serif">B</text>
  <text x="302" y="248" font-size="15" fill="#1a5276" font-family="sans-serif">C</text>
  <text x="28" y="248" font-size="15" fill="#1a5276" font-family="sans-serif">D</text>
  <!-- 三等分点 -->
  <text x="113" y="42" font-size="11" fill="#1a5276" font-family="sans-serif">M</text>
  <text x="142" y="42" font-size="11" fill="#1a5276" font-family="sans-serif">N</text>
  <text x="122" y="248" font-size="11" fill="#1a5276" font-family="sans-serif">O</text>
  <text x="208" y="248" font-size="11" fill="#1a5276" font-family="sans-serif">P</text>
  <text x="52" y="114" font-size="11" fill="#1a5276" font-family="sans-serif">J</text>
  <text x="36" y="174" font-size="11" fill="#1a5276" font-family="sans-serif">I</text>
  <text x="219" y="114" font-size="11" fill="#1a5276" font-family="sans-serif">K</text>
  <text x="260" y="174" font-size="11" fill="#1a5276" font-family="sans-serif">L</text>
  <!-- EFGH -->
  <text x="114" y="102" font-size="11" fill="#1a5276" font-family="sans-serif">E</text>
  <text x="171" y="102" font-size="11" fill="#1a5276" font-family="sans-serif">F</text>
  <text x="193" y="186" font-size="11" fill="#1a5276" font-family="sans-serif">G</text>
  <text x="110" y="186" font-size="11" fill="#1a5276" font-family="sans-serif">H</text>
</svg>
