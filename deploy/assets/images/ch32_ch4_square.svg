<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" width="360" height="360">
  <style>
    text { font-family: "Times New Roman", SimSun, serif; font-size: 16px; font-style: italic; fill: #333; }
  </style>
  <!-- 正方形 ABCD：A左上 B左下 C右下 D右上 -->
  <rect x="60" y="40" width="240" height="240" fill="#f4e5df" stroke="#333" stroke-width="2"/>
  <!-- E中点AB（左边中点），F中点BC（下边中点） -->
  <circle cx="60" cy="160" r="4" fill="#333"/>
  <circle cx="180" cy="280" r="4" fill="#333"/>
  <!-- AF 与 CE -->
  <line x1="60" y1="40" x2="180" y2="280" stroke="#e03a3a" stroke-width="2"/>
  <line x1="300" y1="280" x2="60" y2="160" stroke="#3030a0" stroke-width="2"/>
  <!-- G 交点 approximately -->
  <circle cx="120" cy="180" r="4" fill="#222"/>
  <!-- 辅助 GB -->
  <line x1="120" y1="180" x2="60" y2="280" stroke="#888" stroke-width="1.4" stroke-dasharray="5,3"/>
  <!-- 字母 -->
  <text x="48" y="44" text-anchor="end">A</text>
  <text x="48" y="288" text-anchor="end">B</text>
  <text x="312" y="288" text-anchor="start">C</text>
  <text x="312" y="44" text-anchor="start">D</text>
  <text x="42" y="165" text-anchor="end">E</text>
  <text x="180" y="300" text-anchor="middle">F</text>
  <text x="130" y="175" text-anchor="start">G</text>
</svg>