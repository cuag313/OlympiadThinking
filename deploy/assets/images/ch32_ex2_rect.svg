<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" width="360" height="220">
  <style>
    text { font-family: SimSun, "Microsoft YaHei", serif; font-size: 14px; fill: #333; }
    .num { font-size: 16px; font-weight: bold; fill: #1a5276; }
  </style>
  <!-- 大长方形 -->
  <rect x="40" y="30" width="280" height="160" fill="none" stroke="#333" stroke-width="2"/>
  <!-- 分割线 -->
  <line x1="40" y1="110" x2="320" y2="110" stroke="#333" stroke-width="1.8"/>
  <line x1="190" y1="30" x2="190" y2="190" stroke="#333" stroke-width="1.8"/>
  <!-- 左上25 -->
  <text x="115" y="75" text-anchor="middle" class="num">25</text>
  <!-- 右上20 -->
  <text x="255" y="75" text-anchor="middle" class="num">20</text>
  <!-- 左下阴影 -->
  <rect x="41" y="111" width="148" height="78" fill="#5d6d7e" opacity="0.85"/>
  <text x="115" y="155" text-anchor="middle" fill="#fff" font-weight="bold">阴影</text>
  <!-- 右下30 -->
  <text x="255" y="155" text-anchor="middle" class="num">30</text>
</svg>