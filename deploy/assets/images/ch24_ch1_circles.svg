<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 190" width="600" height="190">
  <style>
    text { font-family: "Microsoft YaHei", Arial, sans-serif; font-size: 14px; }
    .name { font-weight: bold; fill: #333; }
    .cap { font-size: 12px; fill: #555; }
  </style>

  <!-- 灰底（仿原书） -->
  <rect x="0" y="0" width="600" height="190" fill="#d6d2cc"/>

  <!-- 思思行：5个实圈 + 3个虚圈 -->
  <text x="50" y="66" text-anchor="end" class="name">思思</text>
  <g stroke="#333" stroke-width="1.5" fill="none">
    <circle cx="70" cy="60" r="9"/>
    <circle cx="92" cy="60" r="9"/>
    <circle cx="114" cy="60" r="9"/>
    <circle cx="136" cy="60" r="9"/>
    <circle cx="158" cy="60" r="9"/>
  </g>
  <g stroke="#e74c3c" stroke-width="1.5" fill="none" stroke-dasharray="3,2">
    <circle cx="184" cy="60" r="9"/>
    <circle cx="206" cy="60" r="9"/>
    <circle cx="228" cy="60" r="9"/>
  </g>
  <!-- 收到的3本提示 -->
  <line x1="171" y1="45" x2="241" y2="45" stroke="#e74c3c" stroke-width="1"/>
  <text x="206" y="38" text-anchor="middle" class="cap" fill="#e74c3c">收到的3本</text>
  <text x="255" y="66" class="cap" fill="#c0392b" font-weight="bold">5+3=8（本）</text>

  <!-- 想想行：19个实圈，按 8 / 8 / 3 分三组并加框 -->
  <text x="50" y="126" text-anchor="end" class="name">想想</text>
  <!-- 组框 -->
  <rect x="60" y="97" width="190" height="46" fill="none" stroke="#555" stroke-width="1.2"/>
  <rect x="252" y="97" width="190" height="46" fill="none" stroke="#555" stroke-width="1.2"/>
  <rect x="444" y="97" width="76" height="46" fill="none" stroke="#555" stroke-width="1.2"/>
  <!-- 第一组8圈 -->
  <g stroke="#333" stroke-width="1.5" fill="none">
    <circle cx="72" cy="120" r="9"/>
    <circle cx="94" cy="120" r="9"/>
    <circle cx="116" cy="120" r="9"/>
    <circle cx="138" cy="120" r="9"/>
    <circle cx="160" cy="120" r="9"/>
    <circle cx="182" cy="120" r="9"/>
    <circle cx="204" cy="120" r="9"/>
    <circle cx="226" cy="120" r="9"/>
  </g>
  <!-- 第二组8圈 -->
  <g stroke="#333" stroke-width="1.5" fill="none">
    <circle cx="264" cy="120" r="9"/>
    <circle cx="286" cy="120" r="9"/>
    <circle cx="308" cy="120" r="9"/>
    <circle cx="330" cy="120" r="9"/>
    <circle cx="352" cy="120" r="9"/>
    <circle cx="374" cy="120" r="9"/>
    <circle cx="396" cy="120" r="9"/>
    <circle cx="418" cy="120" r="9"/>
  </g>
  <!-- 第三组3圈 -->
  <g stroke="#333" stroke-width="1.5" fill="none">
    <circle cx="456" cy="120" r="9"/>
    <circle cx="478" cy="120" r="9"/>
    <circle cx="500" cy="120" r="9"/>
  </g>
  <!-- 组标注 -->
  <text x="155" y="168" text-anchor="middle" class="cap">= 思思现在的8本</text>
  <text x="347" y="168" text-anchor="middle" class="cap">= 思思现在的8本（2倍）</text>
  <text x="482" y="168" text-anchor="middle" class="cap">+3本</text>
  <text x="560" y="126" text-anchor="middle" class="name" fill="#27ae60">19本</text>
</svg>
